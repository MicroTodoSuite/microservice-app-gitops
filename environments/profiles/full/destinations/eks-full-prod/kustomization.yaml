apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full-production environment policy. The economical prod root remains the
# base; this destination overlay changes only its cluster-bound secret reader.
resources:
  - ../../../../prod

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: external-secrets-jwt
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::575172595729:role/lex-mts-fprd-role-jwtprd
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: auth-api-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: lex-mts-fprd-sm-jwtprd
