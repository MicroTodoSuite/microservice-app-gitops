apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  annotations:
    data-continuity.microtodosuite.io/risk: ephemeral-single-node-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: environment-dependency
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          args:
            - redis-server
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "no"
            - --port
            - "6379"
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: [redis-cli, -h, 127.0.0.1, -p, "6379", ping]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [redis-cli, -h, 127.0.0.1, -p, "6379", ping]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [redis-cli, -h, 127.0.0.1, -p, "6379", ping]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
