apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-owned namespace policy for the local pilot environment.
# One folder per environment: quotas, limits, and network policy belong to the
# environment layer, never to a service overlay. Future managed environments
# (dev/staging/prod on EKS) add sibling folders with their own values.
namespace: microtodo-local

resources:
  - resourcequota.yaml
  - limitrange.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow-dns.yaml
  - networkpolicy-allow-intra-namespace.yaml
