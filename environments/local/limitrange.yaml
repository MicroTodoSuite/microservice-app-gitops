# Defaults and bounds for containers that omit resource settings, so a workload
# without explicit capacity cannot exhaust the environment.
apiVersion: v1
kind: LimitRange
metadata:
  name: environment-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 512Mi
