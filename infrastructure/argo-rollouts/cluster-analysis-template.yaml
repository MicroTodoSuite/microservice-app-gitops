apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: microtodosuite-canary-health
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  args:
    - name: workload
  metrics:
    # Replaces the earlier curl-based connectivity probe with a real business
    # signal: the canary revision's own HTTP 5xx error-rate ratio, sourced
    # from the workload:http_errors:ratio5m recording rule in
    # infrastructure/prometheus/rules/golden-signals.yaml, scoped to
    # revision="canary" by the ServiceMonitors in
    # infrastructure/prometheus/servicemonitors/canary-workloads.yaml.
    # Decided in specs/006-observability-platform-foundation's Clarifications
    # session: fail when the ratio exceeds 5% over the recording rule's own
    # 5-minute window.
    - name: canary-error-rate
      failureLimit: 0
      interval: 30s
      count: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.observability.svc:9090
          query: |
            workload:http_errors:ratio5m{workload="{{ args.workload }}", revision="canary"}
      successCondition: result[0] <= 0.05
      failureCondition: result[0] > 0.05
