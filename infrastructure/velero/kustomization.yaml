apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Velero with the Azure object-store plugin, deployed by ArgoCD from a
# vendored, pinned render (spec 012, T004/T005). Economical-profile-only: the
# eks-dev destination root composes it with the eco backup location, the
# External Secrets credentials path, and the schedules. See README.md.
#
# Provider-neutral: no BackupStorageLocation, VolumeSnapshotLocation, Schedule,
# Secret, or node agent lives here (FR-004).
#
# Ownership note: per constitution principle 11, ArgoCD owns this add-on.
resources:
  - vendor/v1.18.3/manifests.yaml

patches:
  # The vendored Namespace is the installer's; it joins the platform's
  # first sync wave like every other controller namespace. The installer
  # labels it Pod Security "privileged" for the node agent's hostPath mounts;
  # no node agent is rendered (G2), so the server runs under "baseline".
  - target:
      version: v1
      kind: Namespace
      name: velero
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
      - op: add
        path: /metadata/labels/app.kubernetes.io~1name
        value: velero
      - op: add
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: microtodosuite-platform
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: baseline
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1audit
        value: baseline
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1warn
        value: baseline
  # The render uses --no-secret so that no Secret is ever vendored. This adds
  # back the installer's own credentials wiring (pkg/install/deployment.go at
  # v1.18.3): the Secret cloud-credentials mounted read-only at /credentials,
  # read by the Azure plugin through AZURE_CREDENTIALS_FILE. The Secret itself
  # is produced in-cluster by External Secrets (FR-003, FR-010).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: velero
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: velero
        namespace: velero
      spec:
        template:
          spec:
            containers:
              - name: velero
                env:
                  - name: AZURE_CREDENTIALS_FILE
                    value: /credentials/cloud
                volumeMounts:
                  - name: cloud-credentials
                    mountPath: /credentials
            volumes:
              - name: cloud-credentials
                secret:
                  secretName: cloud-credentials
                  defaultMode: 0444

images:
  - name: velero/velero
    digest: sha256:b839e52bc2c69eb3b5a84b010b8b3c7f714f3c5ef50b77ec7770a382a8f2e0ab
  - name: velero/velero-plugin-for-microsoft-azure
    digest: sha256:77aa9463fba56325775264872ec0e7692e7e5fe693be701c219441401b6de973
