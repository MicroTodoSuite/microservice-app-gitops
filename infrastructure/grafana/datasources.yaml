apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-k8s.observability.svc:9090
        isDefault: true
        editable: false
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-query.observability.svc:16686
        editable: false
      # Loki is added by this feature's User Story 5 task (tasks.md T043),
      # once that component exists; adding it here now would point at a
      # Service that does not exist yet.
