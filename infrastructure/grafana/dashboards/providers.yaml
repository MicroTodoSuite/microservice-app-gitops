apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: observability
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: golden-signals
        orgId: 1
        folder: "MicroTodoSuite Golden Signals"
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
