# In-cluster generated admin password, matching the same pattern already used
# for auth-api's JWT secret (apps/auth-api/overlays/local/external-secret.yaml):
# ESO's Password generator creates it inside the cluster, no value is ever
# committed to Git. This is an internal, port-forward-only dev credential
# (FR-017), not a value shared with an external system.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
spec:
  length: 32
  digits: 6
  symbols: 0
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: "0"
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
