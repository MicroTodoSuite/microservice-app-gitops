# Falcosidekick 2.34.1: forwards Falco's HTTP output to Slack (real env var
# confirmed against its own README: SLACK_WEBHOOKURL). This is the tool
# definitions.md already documents by name for exactly this purpose, not a
# choice invented for this feature.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falcosidekick
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  labels:
    app.kubernetes.io/name: falcosidekick
    app.kubernetes.io/part-of: microtodosuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcosidekick
    spec:
      serviceAccountName: falcosidekick
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falcosidekick
          image: falcosecurity/falcosidekick@sha256:d4f0d7c538ede3fe4a491143c45c0787bf4fc24e6fcac6d39dff6721d75a9419
          ports:
            - name: http
              containerPort: 2801
          envFrom:
            - secretRef:
                name: falcosidekick-slack-webhook
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: falcosidekick
  labels:
    app.kubernetes.io/name: falcosidekick
spec:
  selector:
    app.kubernetes.io/name: falcosidekick
  ports:
    - name: http
      port: 2801
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falcosidekick-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falcosidekick-allow-falco-and-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 2801
          protocol: TCP
  egress:
    # Slack's API over HTTPS, and DNS to resolve it.
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
