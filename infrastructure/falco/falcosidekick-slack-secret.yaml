# Mirrors spec 006's Alertmanager Slack pattern exactly (infrastructure/
# prometheus/alertmanager-config.yaml): same disclosed, explicitly-marked
# placeholder IRSA role ARN as environments/base/external-secrets-
# serviceaccount.yaml - not real yet, pending the actual IAM role from
# microservice-app-ops. The webhook value itself is provisioned out-of-band
# by a human in Slack's own admin UI; this only wires it through ESO.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-external-secrets-jwt
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/replace-environment-security-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: security-external-secrets-jwt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-slack-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: falcosidekick-slack-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_WEBHOOKURL
      remoteRef:
        key: replace/environment/falcosidekick-slack-webhook
