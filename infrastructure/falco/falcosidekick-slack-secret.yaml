# Mirrors spec 006's Alertmanager Slack pattern exactly (infrastructure/
# prometheus/alertmanager-config.yaml). Trusts exactly this ServiceAccount
# subject (system:serviceaccount:security:security-external-secrets-jwt),
# provisioned by the microtodosuite-security-secrets-reader IRSA role in
# microservice-app-ops (aws/modules/environment-foundation/security-irsa.tf).
# The webhook value itself is provisioned out-of-band by a human in Slack's
# own admin UI; this only wires it through ESO.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-external-secrets-jwt
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::916491575487:role/microtodosuite-security-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: security-external-secrets-jwt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-slack-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: falcosidekick-slack-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_WEBHOOKURL
      remoteRef:
        key: microtodosuite/security/falcosidekick-slack-webhook
