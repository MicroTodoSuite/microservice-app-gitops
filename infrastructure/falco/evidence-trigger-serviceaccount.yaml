# ServiceAccount for the disabled-by-default Falco evidence trigger in
# triggers/job.yaml. It lives in the parent root so the Job's identity exists
# before a reviewed commit activates the trigger. It has no token and no Role
# or binding, so the trigger holds no Kubernetes API permission (spec 009 T088,
# research.md Decision 22).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-evidence-trigger
  labels:
    app.kubernetes.io/name: falco-evidence-trigger
    app.kubernetes.io/part-of: microtodosuite
automountServiceAccountToken: false
