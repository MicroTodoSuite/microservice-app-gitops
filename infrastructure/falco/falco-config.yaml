# Adapted from Falco 9.1.0's real Helm chart default falco.yaml (verified
# against https://raw.githubusercontent.com/falcosecurity/charts/falco-9.1.0/
# charts/falco/values.yaml): default/community rules_files kept as-is,
# json_output and http_output enabled to forward findings to Falcosidekick
# (the "when using falcosidekick, json_output must be true" note in that
# same values.yaml). engine.kind selects the modern eBPF driver here, in
# config, not as a falco binary CLI flag: `--modern-bpf` was a
# docker-entrypoint.sh wrapper convenience, not a real getopt option, and
# fails with "Option 'modern-bpf' does not exist" against the actual binary.
#
# The container plugin is declared but NOT auto-loaded by upstream's own
# default falco.yaml (load_plugins: [] there) - the default rules_files
# still require it ("Plugin requirement not satisfied, must load one of:
# container (>= 0.4.0)"), so it must be added to load_plugins explicitly.
# library_path and init_config match the upstream default verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
data:
  falco.yaml: |
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/rules.d

    engine:
      kind: modern_ebpf

    plugins:
      - name: container
        library_path: libcontainer.so
        init_config:
          label_max_len: 100
          with_size: false

    load_plugins: [container]

    json_output: true
    json_include_output_property: true

    http_output:
      enabled: true
      url: "http://falcosidekick:2801/"

    log_stderr: true
    log_syslog: false
    log_level: info

    priority: debug

    buffered_outputs: false

    syscall_event_drops:
      actions:
        - log
        - alert
      rate: 0.03333
      max_burst: 1

    metrics:
      enabled: false
