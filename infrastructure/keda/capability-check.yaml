apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-autoscaling-check
  namespace: keda
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: platform-autoscaling-check
    app.kubernetes.io/part-of: microtodosuite-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-autoscaling-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-autoscaling-check
        app.kubernetes.io/part-of: microtodosuite-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: platform-autoscaling-check
  namespace: keda
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: microtodosuite-platform
spec:
  scaleTargetRef:
    name: platform-autoscaling-check
  pollingInterval: 30
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 1
  triggers:
    - type: cron
      metadata:
        timezone: Etc/UTC
        start: 0 0 * * *
        end: 59 23 * * *
        desiredReplicas: "1"
