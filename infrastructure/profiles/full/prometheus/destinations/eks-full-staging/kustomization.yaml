apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus for the eks-full-staging destination (spec 009 T085, research.md
# Decision 21). The aws root is the base; this root names the cluster and the
# environment its alerts come from, and points the business ServiceMonitors at
# microtodo-staging (spec 009 T090, research.md Decision 23). clusters/eks-full-staging's activation
# names this path, and cluster matches the physicalCluster its registration
# declares: full staging runs on the rebuilt fstg cluster.
resources:
  - ../../aws

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Prometheus
      name: k8s
    patch: |-
      - op: add
        path: /spec/externalLabels
        value:
          cluster: lex-mts-fstg-eks-main
          environment: staging
  # The five business ServiceMonitors inherit microtodo-dev from the economical
  # root; this cluster holds only microtodo-staging (research.md Decision 23). The
  # canary ServiceMonitors keep microtodo-prod.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: '^(auth-api|todos-api|users-api|frontend|log-message-processor)$'
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames
        value:
          - microtodo-staging
  - target:
      version: v1
      kind: ServiceAccount
      name: observability-external-secrets-jwt
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::575172595729:role/lex-mts-fstg-role-obssecret
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: alertmanager-slack-webhook
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: lex-mts-fstg-sm-slackobs
