apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus for the eks-full-staging destination (spec 009 T085, research.md
# Decision 21). The aws root is the base; this root names the cluster and the
# environment its alerts come from, and points the business ServiceMonitors at
# microtodo-staging (spec 009 T090, research.md Decision 23). clusters/eks-full-staging's activation
# names this path, and cluster matches the physicalCluster its registration
# declares: full staging runs on the existing demo-full cluster.
resources:
  - ../../aws

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Prometheus
      name: k8s
    patch: |-
      - op: add
        path: /spec/externalLabels
        value:
          cluster: microtodosuite-demo-full
          environment: staging
  # The five business ServiceMonitors inherit microtodo-dev from the economical
  # root; this cluster holds only microtodo-staging (research.md Decision 23). The
  # canary ServiceMonitors keep microtodo-prod.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: '^(auth-api|todos-api|users-api|frontend|log-message-processor)$'
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames
        value:
          - microtodo-staging
