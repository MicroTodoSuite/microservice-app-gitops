apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two kube-prometheus exporters OpenCost reads (spec 009 T144 and T147,
# research.md Decision 24). See vendor/v0.18.0/README.md for what this subset
# retains, what it drops, and why the economical profile keeps excluding it.
#
# This is a nested Kustomization rather than part of the parent Component on
# purpose: a Component's namespace and images transformers apply to everything
# the including root has accumulated, which would retarget the base's own
# resources and rewrite the Prometheus Operator's kube-rbac-proxy reference
# from name:tag@digest to name@digest. Here both transformers reach only the
# fourteen files below. It is not a deployable root; the aws and azure roots
# reach it through ../ (the Component).
resources:
  - vendor/v0.18.0/nodeExporter-clusterRole.yaml
  - vendor/v0.18.0/nodeExporter-clusterRoleBinding.yaml
  - vendor/v0.18.0/nodeExporter-daemonset.yaml
  - vendor/v0.18.0/nodeExporter-networkPolicy.yaml
  - vendor/v0.18.0/nodeExporter-serviceAccount.yaml
  - vendor/v0.18.0/nodeExporter-service.yaml
  - vendor/v0.18.0/nodeExporter-serviceMonitor.yaml
  - vendor/v0.18.0/kubeStateMetrics-clusterRole.yaml
  - vendor/v0.18.0/kubeStateMetrics-clusterRoleBinding.yaml
  - vendor/v0.18.0/kubeStateMetrics-deployment.yaml
  - vendor/v0.18.0/kubeStateMetrics-networkPolicy.yaml
  - vendor/v0.18.0/kubeStateMetrics-serviceAccount.yaml
  - vendor/v0.18.0/kubeStateMetrics-service.yaml
  - vendor/v0.18.0/kubeStateMetrics-serviceMonitor.yaml

# Upstream ships everything at namespace: monitoring; this cluster's
# convention is one observability namespace, the same retarget
# infrastructure/prometheus performs on its own subset.
namespace: observability

# Digest only, no tag: an immutable reference, never a mutable one.
images:
  - name: quay.io/prometheus/node-exporter
    digest: sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    digest: sha256:6b2f0b6f2f86ac5b1aa883a033a8dd55bb96c16d191ec973393bdaadaddac914
  - name: quay.io/brancz/kube-rbac-proxy
    digest: sha256:53d5a3911ac076d000c92362d4939a3147ba21f231edf82926c82d16dbdd8850

patches:
  # kube-state-metrics drops every pod label by default, so cost per service
  # and per profile would have nothing to group by. The allowlist is the two
  # labels the cost dashboard groups on and no other: each one becomes a
  # kube_pod_labels column, so an open allowlist would turn every annotation-
  # like label in the cluster into a time series.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kube-state-metrics
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: kube-state-metrics
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --metric-labels-allowlist=pods=[app.kubernetes.io/name,microtodosuite.io/profile]
