apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full-profile Prometheus and Alertmanager on AKS (spec 009 T085,
# research.md Decision 21). The economical root is the base and stays
# unchanged; this root adds only what the full profile changes.
#
# Volumes use managed-csi, the Azure Disk class AKS creates in every cluster
# (Standard SSD, reclaim policy Delete, expandable). Azure encrypts managed
# disks at rest with platform-managed keys, so the class needs no key
# parameter: https://learn.microsoft.com/azure/aks/concepts-storage#storage-classes
resources:
  - ../../../../prometheus

# The full-profile alerts and their monitors, and the Slack title that names
# the environment and cluster, shared with the aws root.
components:
  - ../components/alerts
  - ../components/notifications

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Prometheus
      name: k8s
    patch: |-
      - op: replace
        path: /spec/storage/volumeClaimTemplate/spec/storageClassName
        value: managed-csi
  # Alertmanager keeps silences and its notification log in memory in the
  # economical profile, so a restart forgets both. One replica, as in the
  # economical profile (research.md Decision 10); the operator's default
  # retention of 120h bounds what the volume holds.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: Alertmanager
      name: main
    patch: |-
      - op: add
        path: /spec/storage
        value:
          volumeClaimTemplate:
            spec:
              storageClassName: managed-csi
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
