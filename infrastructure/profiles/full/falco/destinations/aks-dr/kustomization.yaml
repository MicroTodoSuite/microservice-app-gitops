apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../../../falco]
components: [../../../components/aks-acr-images]
patches:
  - target: {version: v1, kind: ServiceAccount, name: security-external-secrets-jwt}
    patch: |-
      - op: remove
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
  - target: {group: external-secrets.io, version: v1, kind: ExternalSecret, name: falcosidekick-slack-webhook}
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: pending-falcosidekick-slack-webhook
