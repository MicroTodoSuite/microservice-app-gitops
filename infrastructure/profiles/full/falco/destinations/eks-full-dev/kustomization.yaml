apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../falco

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: security-external-secrets-jwt
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::575172595729:role/lex-mts-fdev-role-secsecret
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: falcosidekick-slack-webhook
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: lex-mts-fdev-sm-slacksec
