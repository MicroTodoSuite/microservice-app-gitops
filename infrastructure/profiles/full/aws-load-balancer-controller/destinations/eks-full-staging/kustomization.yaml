apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS Load Balancer Controller for the rebuilt fstg cluster. The VPC Name tag
# avoids committing an ID before Terraform creates the VPC.
resources:
  - ../../../../../aws-load-balancer-controller

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: aws-load-balancer-controller
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::575172595729:role/lex-mts-fstg-role-lbcontrol
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: aws-load-balancer-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                args:
                  - --cluster-name=lex-mts-fstg-eks-main
                  - --ingress-class=alb
                  - --aws-region=us-east-1
                  - --aws-vpc-tags=Name=lex-mts-fstg-vpc-main
