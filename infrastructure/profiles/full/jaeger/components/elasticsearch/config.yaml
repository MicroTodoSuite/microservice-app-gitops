# Replaces the economical Badger configuration with Jaeger 2.20.0's
# Elasticsearch backend. Field names follow
# internal/storage/elasticsearch/config/config.go at v2.20.0 (server_urls,
# auth.basic.username, auth.basic.password_file, tls.ca_file, and
# indices.<index>.shards/replicas); the layout follows
# cmd/jaeger/config-elasticsearch.yaml at the same tag.
#
# - Indices rotate daily (the default periodic rotation); the
#   jaeger-es-index-cleaner CronJob deletes those older than 3 days.
# - One shard and no replica per index: Elasticsearch runs a single node, where
#   a replica can never be assigned and would keep every index yellow.
# - The password is read from a file mounted from Secret
#   jaeger-elasticsearch-credentials, never from the config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info

    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133

      jaeger_query:
        storage:
          traces: elasticsearch_store

      jaeger_storage:
        backends:
          elasticsearch_store:
            elasticsearch:
              server_urls:
                - https://platform-es-http.elasticsearch.svc:9200
              auth:
                basic:
                  username: jaeger
                  password_file: /etc/jaeger-elasticsearch/credentials/password
              tls:
                ca_file: /etc/jaeger-elasticsearch/ca/ca.crt
              indices:
                spans:
                  shards: 1
                  replicas: 0
                services:
                  shards: 1
                  replicas: 0
                dependencies:
                  shards: 1
                  replicas: 0
                sampling:
                  shards: 1
                  replicas: 0

    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:

    exporters:
      jaeger_storage_exporter:
        trace_storage: elasticsearch_store
