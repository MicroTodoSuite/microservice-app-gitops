# Copies Jaeger's Elasticsearch password and ECK's public HTTP CA from the
# elasticsearch namespace into observability, through the External Secrets
# Kubernetes provider (External Secrets 2.9.0 docs/provider/kubernetes.md).
#
# The store authenticates as jaeger-elasticsearch-reader. In elasticsearch, the
# Role jaeger-elasticsearch-secret-reader (infrastructure/elasticsearch/
# jaeger-user.yaml) grants that ServiceAccount get on exactly two Secrets:
# jaeger-elasticsearch-user and platform-es-http-certs-public. The provider
# validates the store with a SelfSubjectRulesReview that looks for get on
# secrets (providers/v1/kubernetes/validate.go).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger-elasticsearch-reader
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: elasticsearch
  namespace: observability
spec:
  provider:
    kubernetes:
      remoteNamespace: elasticsearch
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: jaeger-elasticsearch-reader
---
# Only the password: Jaeger's username, jaeger, is not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jaeger-elasticsearch-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: elasticsearch
  target:
    name: jaeger-elasticsearch-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: jaeger-elasticsearch-user
        property: password
---
# ECK publishes the CA of its self-signed HTTP certificate in
# <name>-es-http-certs-public under ca.crt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jaeger-elasticsearch-ca
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: elasticsearch
  target:
    name: jaeger-elasticsearch-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-es-http-certs-public
        property: ca.crt
