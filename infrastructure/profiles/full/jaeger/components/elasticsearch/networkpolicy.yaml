# The economical jaeger-default-deny denies all traffic for every pod in
# observability; these add only the flows Elasticsearch storage needs.
# Elasticsearch's HTTP Service (platform-es-http) listens on 9200.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-allow-elasticsearch
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-es-index-cleaner-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger-es-index-cleaner
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
