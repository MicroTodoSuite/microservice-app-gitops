# Copies Grafana's Elasticsearch password and ECK's public HTTP CA from the
# elasticsearch namespace into observability, through the External Secrets
# Kubernetes provider, the same way the full Jaeger does.
#
# The store is named elasticsearch-grafana, not elasticsearch: the full Jaeger
# Application already owns SecretStore elasticsearch in this namespace, and two
# Applications must never manage one resource. It authenticates as
# grafana-elasticsearch-reader, which Role grafana-elasticsearch-secret-reader
# (infrastructure/elasticsearch/grafana-user.yaml) lets get exactly
# grafana-elasticsearch-user and platform-es-http-certs-public.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-elasticsearch-reader
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: elasticsearch-grafana
  namespace: observability
spec:
  provider:
    kubernetes:
      remoteNamespace: elasticsearch
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: grafana-elasticsearch-reader
---
# Only the password: the datasource's username, grafana, is not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-elasticsearch-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: elasticsearch-grafana
  target:
    name: grafana-elasticsearch-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana-elasticsearch-user
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-elasticsearch-ca
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: elasticsearch-grafana
  target:
    name: grafana-elasticsearch-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-es-http-certs-public
        property: ca.crt
