apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Grafana's Elasticsearch datasource and trace-to-log correlation for the full
# profile (spec 009 T085, research.md Decision 21), shared by both full Grafana
# roots.
#
# The grafana user, its role, and the Role that lets this Application read the
# user's password and ECK's public HTTP CA live in infrastructure/elasticsearch/
# (grafana-user.yaml), because ECK reads file-realm and role Secrets only from
# the Elasticsearch resource's namespace.
resources:
  - elasticsearch-secrets.yaml
  - networkpolicy.yaml

patches:
  - path: datasources.yaml
  - path: deployment.yaml
