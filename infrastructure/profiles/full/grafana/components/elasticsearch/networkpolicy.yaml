# The economical grafana-allow-port-forward-and-egress lets Grafana reach only
# the observability namespace and DNS; the Elasticsearch datasource also needs
# Elasticsearch's HTTP Service (platform-es-http) on 9200.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow-elasticsearch
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elasticsearch
      ports:
        - port: 9200
          protocol: TCP
