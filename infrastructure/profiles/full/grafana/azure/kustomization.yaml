apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full-profile Grafana on AKS (spec 009 T085, research.md Decision 21). The
# economical root is the base and stays unchanged; this root adds only what
# the full profile changes.
#
# The volume uses managed-csi, the Azure Disk class AKS creates in every
# cluster (Standard SSD, reclaim policy Delete, expandable). Azure encrypts
# managed disks at rest with platform-managed keys, so the class needs no key
# parameter: https://learn.microsoft.com/azure/aks/concepts-storage#storage-classes
resources:
  - ../../../../grafana

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: grafana-storage
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: managed-csi
