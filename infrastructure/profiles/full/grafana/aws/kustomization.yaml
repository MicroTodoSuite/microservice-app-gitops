apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full-profile Grafana on EKS (spec 009 T085, research.md Decision 21). The
# economical root is the base and stays unchanged. Grafana already keeps its
# data on the gp3 class, which infrastructure/ebs-csi-driver declares with
# encrypted: "true", so no volume is patched.
resources:
  - ../../../../grafana

# The Elasticsearch datasource and trace-to-log correlation, shared with the
# azure root.
components:
  - ../components/cost
  - ../components/elasticsearch
