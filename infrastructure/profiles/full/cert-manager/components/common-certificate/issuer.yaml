apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-common-production
spec:
  acme:
    email: operations@microtodosuite.online
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-common-production-account
    solvers:
      - selector:
          dnsNames:
            - app.microtodosuite.online
        dns01:
          route53:
            region: us-east-1
