apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../../../trivy-operator]
components: [../../../components/aks-acr-images]
patches:
  - target: {version: v1, kind: ServiceAccount, name: trivy-operator}
    patch: |-
      - op: remove
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
  - target: {version: v1, kind: ConfigMap, name: trivy-operator}
    patch: |-
      - op: replace
        path: /data/node.collector.imageRef
        value: pendingacr.azurecr.io/microtodosuite/platform/trivy-node-collector:pending-t131
      - op: replace
        path: /data/policies.bundle.oci.ref
        value: pendingacr.azurecr.io/microtodosuite/platform/trivy-checks:pending-t131
  - target: {version: v1, kind: ConfigMap, name: trivy-operator-trivy-config}
    patch: |-
      - op: replace
        path: /data/trivy.dbRepository
        value: pendingacr.azurecr.io/microtodosuite/platform/trivy-db
      - op: replace
        path: /data/trivy.javaDbRepository
        value: pendingacr.azurecr.io/microtodosuite/platform/trivy-java-db
