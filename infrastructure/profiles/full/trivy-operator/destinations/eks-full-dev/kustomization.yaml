apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../trivy-operator

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: trivy-operator
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::575172595729:role/lex-mts-fdev-role-trivyecr
