apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Karpenter for lex-mts-fprd-eks-main. The 8-vCPU limit is per cluster, so
# these three roots enforce the approved 24-vCPU aggregate ceiling.
resources:
  - ../../../../../karpenter
  - ../../../../../karpenter/node-provisioning

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: karpenter
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::575172595729:role/lex-mts-fprd-role-karpenter
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: karpenter
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: karpenter
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: CLUSTER_NAME
                    value: lex-mts-fprd-eks-main
                  - name: INTERRUPTION_QUEUE
                    value: lex-mts-fprd-sqs-karpenter
                  - name: AWS_REGION
                    value: us-east-1
  - target:
      group: karpenter.k8s.aws
      version: v1
      kind: EC2NodeClass
      name: full-profile-spot
    patch: |-
      - op: replace
        path: /spec/role
        value: lex-mts-fprd-role-node
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: lex-mts-fprd-eks-main
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: lex-mts-fprd-eks-main
  - target:
      group: karpenter.sh
      version: v1
      kind: NodePool
      name: full-profile-spot
    patch: |-
      - op: replace
        path: /spec/limits/cpu
        value: "8"
