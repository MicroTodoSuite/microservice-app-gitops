apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../../../chaos-mesh]
components: [../../../components/aks-acr-images]
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: chaos-controller-manager}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: chaos-controller-manager}
      spec:
        template:
          spec:
            containers:
              - name: chaos-mesh
                env:
                  - name: POD_FAILURE_PAUSE_IMAGE
                    value: pendingacr.azurecr.io/microtodosuite/platform/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
