apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS Load Balancer Controller for lex-mts-eco-eks-main, which publishes the
# economical environments through one shared ALB (spec 009 T174). Region and
# VPC discovery are explicit because workload pods cannot reach IMDS.
resources:
  - ../../../../../aws-load-balancer-controller
  - ingressclass.yaml

patches:
  - target:
      version: v1
      kind: ServiceAccount
      name: aws-load-balancer-controller
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::575172595729:role/lex-mts-eco-role-lbcontrol
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: aws-load-balancer-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                args:
                  - --cluster-name=lex-mts-eco-eks-main
                  - --ingress-class=alb
                  - --aws-region=us-east-1
                  - --aws-vpc-tags=Name=lex-mts-eco-vpc-main
