# The only way Velero's Azure credentials file enters the cluster. A human
# writes the file into lex-mts-eco-sm-velero (ops spec 005 FR-019); External
# Secrets writes it to the Secret and key the Velero Deployment mounts as
# AZURE_CREDENTIALS_FILE=/credentials/cloud. See docs/eco-velero-backups.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: cloud-credentials
    creationPolicy: Owner
  data:
    - secretKey: cloud
      remoteRef:
        key: lex-mts-eco-sm-velero
