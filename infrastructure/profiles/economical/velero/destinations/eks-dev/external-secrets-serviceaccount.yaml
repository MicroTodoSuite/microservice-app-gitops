# The only AWS identity in the velero namespace: External Secrets reads
# Velero's credentials file with it (ops spec 005 FR-020). The velero
# ServiceAccount itself has no AWS role (FR-013).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-external-secrets
  namespace: velero
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::575172595729:role/lex-mts-eco-role-velerosec
