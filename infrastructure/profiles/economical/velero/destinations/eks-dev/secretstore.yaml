# Namespace-scoped store: it can read only what lex-mts-eco-role-velerosec
# allows, which is GetSecretValue on lex-mts-eco-sm-velero (ops spec 005 FR-020).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: velero
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: velero-external-secrets
