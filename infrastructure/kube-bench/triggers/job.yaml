# One kube-bench run with exactly the job spec of ../cronjob.yaml;
# tests/platform/security-hardening.bats keeps the two identical.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-evidence
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/trigger: evidence
spec:
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      hostPID: true
      restartPolicy: Never
      serviceAccountName: kube-bench
      automountServiceAccountToken: false
      containers:
        - name: kube-bench
          image: aquasec/kube-bench@sha256:75506f222d1eb6ce2a751a5533bdc0a3b54c898e2e49e7751d0ee22cfb862679
          command:
            - kube-bench
            - run
            - --targets
            - node,policies,managedservices,controlplane
            - --benchmark
            - eks-1.5.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: tmp
          emptyDir: {}
