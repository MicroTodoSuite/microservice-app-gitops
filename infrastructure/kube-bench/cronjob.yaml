# Adapted from kube-bench v0.16.0's own official job-eks.yaml
# (https://raw.githubusercontent.com/aquasecurity/kube-bench/v0.16.0/
# job-eks.yaml): same targets/benchmark/hostPath mounts, wrapped in a
# CronJob for the recurring schedule FR-005 requires. A finished Job, and so
# its report in the pod log, is kept for 7 days and the 7 most recent
# successful Jobs are retained, so a daily report stays readable until the next
# weekly kube-hunter run (spec 009 T088, research.md Decision 22). A finished
# Job runs no container, so no standing workload remains (FR-007).
#
# hostPID: true is genuinely required here (unlike Falco in this same
# feature): kube-bench inspects the kubelet process's running command-line
# flags to check several CIS controls, which needs host process visibility.
# kube-bench reads host files directly via the mounted hostPaths below and
# makes no Kubernetes API calls for this benchmark, so its dedicated
# ServiceAccount has no token and no Role or binding: no API permission at all
# (spec 008 FR-007, spec 009 T088).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: microtodosuite
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: microtodosuite
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-bench
        spec:
          hostPID: true
          restartPolicy: Never
          serviceAccountName: kube-bench
          automountServiceAccountToken: false
          containers:
            - name: kube-bench
              image: aquasec/kube-bench@sha256:75506f222d1eb6ce2a751a5533bdc0a3b54c898e2e49e7751d0ee22cfb862679
              command:
                - kube-bench
                - run
                - --targets
                - node,policies,managedservices,controlplane
                - --benchmark
                - eks-1.5.0
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-systemd
                  mountPath: /etc/systemd
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
            - name: tmp
              emptyDir: {}
