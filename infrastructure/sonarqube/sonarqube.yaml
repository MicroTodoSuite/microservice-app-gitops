apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: sonarqube
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-extensions
  namespace: sonarqube
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app.kubernetes.io/name: sonarqube
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sonarqube
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/part-of: microtodosuite-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after PostgreSQL and the DB ExternalSecret
spec:
  replicas: 1
  strategy:
    type: Recreate # single instance bound to RWO volumes
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarqube
        app.kubernetes.io/part-of: microtodosuite-platform
    spec:
      serviceAccountName: sonarqube
      automountServiceAccountToken: false
      # Dedicated tooling node. T084 asks for the vm.max_map_count sysctl that
      # SonarQube's embedded Elasticsearch needs (>=262144) to be set at the
      # NODE level "without a privileged pod" — so the privileged init-sysctl
      # container that used to live here is gone. On a real full-dev cluster
      # the node comes from a Karpenter tooling NodePool whose EC2NodeClass
      # userData runs `sysctl -w vm.max_map_count=262144` and carries the
      # `microtodosuite.io/tooling=sonarqube:NoSchedule` taint (that NodePool
      # + EC2NodeClass belongs in infrastructure/karpenter/node-provisioning/
      # and is Phase-4 work — it needs the real cluster name). This toleration
      # is the pod-side half; it is harmless where the taint does not exist
      # (local kind), where the node's default vm.max_map_count already
      # satisfies Elasticsearch.
      tolerations:
        - key: microtodosuite.io/tooling
          operator: Equal
          value: sonarqube
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonarqube
          image: sonarqube:26.8.0.126808-community
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://sonarqube-postgres:5432/sonar
            - name: SONAR_JDBC_USERNAME
              value: sonar
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db
                  key: password
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
            - name: extensions
              mountPath: /opt/sonarqube/extensions
            - name: temp
              mountPath: /opt/sonarqube/temp
          startupProbe:
            httpGet:
              path: /api/system/status
              port: http
            failureThreshold: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonarqube-data
        - name: extensions
          persistentVolumeClaim:
            claimName: sonarqube-extensions
        - name: temp
          emptyDir: {}
