apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Self-hosted SonarQube (code-quality gate for BOTH profiles, research D6).
# INACTIVE: current cluster activation lists omit infrastructure/sonarqube, so
# no cluster deploys it until the intended tooling/management registration adds
# an exact allowlist entry. See README.md.
#
# Hardened for the full-dev tooling role (spec 009, T084): digests pinned
# below, PodDisruptionBudgets, NetworkPolicy, a dedicated-tooling toleration,
# and a nightly pg_dump backup CronJob. Still deferred to the activating
# registration (cloud-specific, cannot be expressed here): the gp3-encrypted
# retained StorageClass overlay, the ingress/TLS exposure, and the Karpenter
# tooling NodePool/EC2NodeClass whose userData sets vm.max_map_count and whose
# taint this deployment already tolerates. Set org var SONAR_HOST_URL + secret
# SONAR_TOKEN once exposed.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - db-secret.yaml
  - postgres.yaml
  - sonarqube.yaml
  - pdb.yaml
  - network-policy.yaml
  - backup-cronjob.yaml

images:
  - name: sonarqube
    digest: sha256:9026624a61cd25542a402a9e7213dd7dbb39724ac9597e331e6b85362558c079
  - name: postgres
    digest: sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
