# Database password provisioned in-cluster by ESO — never committed. One
# generated value is written once to the `sonarqube-db` Secret and consumed by
# BOTH PostgreSQL (POSTGRES_PASSWORD) and SonarQube (SONAR_JDBC_PASSWORD), so
# the two always agree. Same pattern as the services' JWT secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sonarqube-db
  namespace: sonarqube
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-db
  namespace: sonarqube
spec:
  refreshInterval: "0" # generate once; a DB password should be stable
  target:
    name: sonarqube-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: sonarqube-db
