apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-immutable-images
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Immutable Images
    policies.kyverno.io/category: MicroTodoSuite Baseline
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.18.0
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: require-sha256-digest
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "microtodo-*"
      validate:
        allowExistingViolations: true
        message: Business workload images must use an immutable SHA-256 digest.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "*@sha256:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-health-probes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Health Probes
    policies.kyverno.io/category: MicroTodoSuite Baseline
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.18.0
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: require-liveness-and-readiness
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "microtodo-*"
      validate:
        allowExistingViolations: true
        message: Every business workload container must define liveness and readiness probes.
        foreach:
          - list: request.object.spec.containers
            pattern:
              livenessProbe: {}
              readinessProbe: {}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-approved-release-signatures
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Verify Approved Release Signatures
    policies.kyverno.io/category: MicroTodoSuite Supply Chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/minversion: 1.18.0
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  admission: true
  # Private-ECR verification is enforced synchronously by the IRSA-enabled
  # admission controller. Reports-controller scans have no registry identity
  # and would otherwise emit false 401 policy violations for admitted images.
  background: false
  emitWarning: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-reviewed-main-through-pinned-workflow
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "microtodo-*"
      verifyImages:
        - imageReferences:
            - "575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-authapi*"
            - "575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-frontend*"
            - "575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-logmsgproc*"
            - "575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-todosapi*"
            - "575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-usersapi*"
          failureAction: Enforce
          required: true
          mutateDigest: true
          verifyDigest: true
          useCache: true
          imageRegistryCredentials:
            providers:
              - amazon
          # Fulcio puts a GitHub job's job_workflow_ref in the certificate SAN, so
          # the shared CI signs as .github's ci.yml at the ref each service's
          # reviewed main pins. The expression accepts that workflow at any full
          # commit SHA, so a new .github release does not break admission, while
          # each entry still requires one service's repository, refs/heads/main,
          # and a push trigger. Kyverno evaluates subjectRegExp with Go's
          # unanchored MatchString, so the anchors are required (spec 009 T088,
          # research.md Decision 22).
          attestors:
            - count: 1
              entries:
                - keyless:
                    subjectRegExp: '^https://github\.com/MicroTodoSuite/\.github/\.github/workflows/ci\.yml@[0-9a-f]{40}$'
                    issuer: https://token.actions.githubusercontent.com
                    additionalExtensions:
                      githubWorkflowTrigger: push
                      githubWorkflowRepository: MicroTodoSuite/microservice-app-auth-api
                      githubWorkflowRef: refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
                - keyless:
                    subjectRegExp: '^https://github\.com/MicroTodoSuite/\.github/\.github/workflows/ci\.yml@[0-9a-f]{40}$'
                    issuer: https://token.actions.githubusercontent.com
                    additionalExtensions:
                      githubWorkflowTrigger: push
                      githubWorkflowRepository: MicroTodoSuite/microservice-app-todos-api
                      githubWorkflowRef: refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
                - keyless:
                    subjectRegExp: '^https://github\.com/MicroTodoSuite/\.github/\.github/workflows/ci\.yml@[0-9a-f]{40}$'
                    issuer: https://token.actions.githubusercontent.com
                    additionalExtensions:
                      githubWorkflowTrigger: push
                      githubWorkflowRepository: MicroTodoSuite/microservice-app-users-api
                      githubWorkflowRef: refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
                - keyless:
                    subjectRegExp: '^https://github\.com/MicroTodoSuite/\.github/\.github/workflows/ci\.yml@[0-9a-f]{40}$'
                    issuer: https://token.actions.githubusercontent.com
                    additionalExtensions:
                      githubWorkflowTrigger: push
                      githubWorkflowRepository: MicroTodoSuite/microservice-app-frontend
                      githubWorkflowRef: refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
                - keyless:
                    subjectRegExp: '^https://github\.com/MicroTodoSuite/\.github/\.github/workflows/ci\.yml@[0-9a-f]{40}$'
                    issuer: https://token.actions.githubusercontent.com
                    additionalExtensions:
                      githubWorkflowTrigger: push
                      githubWorkflowRepository: MicroTodoSuite/microservice-app-log-message-processor
                      githubWorkflowRef: refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
