# One ServiceMonitor per business workload, labelled revision="stable".
# Prometheus's serviceMonitorSelector is `{}` (see
# vendor/v0.18.0/prometheus-prometheus.yaml), so no extra label is required
# for discovery beyond living in a watched namespace.
#
# microtodo-dev rolls normally; microtodo-prod runs the canary strategy, and
# its stable traffic is scraped here too (spec 006 T023b). Every endpoint
# drops the <workload>-canary Service, which canary-workloads.yaml owns. The
# stable Service selects every pod, so while a canary runs its pods count in
# the stable series as well. Each full destination replaces the namespace list
# with its own namespace (infrastructure/profiles/full/prometheus/destinations).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-api
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-dev", "microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todos-api
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-dev", "microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: todos-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: users-api
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-dev", "microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: users-api
  endpoints:
    # Spring Boot Actuator's web base-path is overridden to "/" in
    # application.properties, so the Prometheus endpoint is /prometheus, not
    # the default /actuator/prometheus.
    - port: http
      path: /prometheus
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-message-processor
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-dev", "microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: log-message-processor
  endpoints:
    # Dedicated metrics port (9090) declared in this service's gitops
    # Service, separate from any application traffic port.
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-dev", "microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  endpoints:
    # nginx-prometheus-exporter sidecar: connection counts from stub_status,
    # read over the pod's loopback (frontend repo, nginx.conf.template).
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
    # nginx's own response counters by status code (frontend repo,
    # njs/metrics.js), which the error ratio reads: stub_status counts
    # requests without their status.
    - port: responses
      path: /metrics
      interval: 30s
      relabelings:
        - action: drop
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: stable
