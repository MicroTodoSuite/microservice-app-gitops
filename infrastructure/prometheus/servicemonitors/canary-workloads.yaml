# Canary-only counterparts to business-workloads.yaml, targeting the
# `<workload>-canary` Service each apps/*/components/strategy-canary already
# defines. Argo Rollouts manages that Service's live pod selector to route
# only to the canary ReplicaSet; the "revision: canary" relabeling below lets
# the golden-signal recording rules (rules/golden-signals.yaml) tell canary
# traffic apart from stable traffic with the same metric name.
#
# The canary strategy is only composed in the `prod` overlay today (`staging`
# and `dev` roll normally, per constitution principle 7), so this targets
# microtodo-prod, not microtodo-dev like business-workloads.yaml. `prod` is a
# structurally disabled scaffold right now (replicas: 0), so these targets
# have no live series until it activates - that activation is out of this
# feature's scope, but the canary gate this feature builds needs this wiring
# to be ready for the moment it does.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-api-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: revision
          replacement: canary
