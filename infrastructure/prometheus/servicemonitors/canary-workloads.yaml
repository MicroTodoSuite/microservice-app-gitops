# Canary counterparts to business-workloads.yaml. Argo Rollouts points each
# `<workload>-canary` Service (apps/*/components/strategy-canary) at the canary
# ReplicaSet alone, so every endpoint keeps only that Service and labels it
# revision="canary" (spec 006 T023b). The golden-signal recording rules
# (rules/golden-signals.yaml) then carry the canary's own traffic, which the
# canary gate (argo-rollouts/cluster-analysis-template.yaml) judges.
#
# Only microtodo-prod composes the canary strategy (`staging` and `dev` roll
# normally, per constitution principle 7). Between rollouts a -canary Service
# follows the stable ReplicaSet, so these series then repeat the stable pods;
# only an analysis run, which starts once the canary pods are ready, reads
# them. The full profile's canary routes by Istio subset and has no -canary
# Service, so these monitors select nothing there.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-api-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todos-api-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: todos-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: users-api-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: users-api
  endpoints:
    # Spring Boot Actuator's web base-path is overridden to "/" in
    # application.properties, so the Prometheus endpoint is /prometheus, not
    # the default /actuator/prometheus.
    - port: http
      path: /prometheus
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-message-processor-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: log-message-processor
  endpoints:
    # Dedicated metrics port (9090) declared in this service's gitops
    # Service, separate from any application traffic port.
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-canary
  labels:
    app.kubernetes.io/part-of: microtodosuite
spec:
  namespaceSelector:
    matchNames: ["microtodo-prod"]
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  endpoints:
    # nginx-prometheus-exporter sidecar: connection counts from stub_status,
    # read over the pod's loopback (frontend repo, nginx.conf.template).
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
    # nginx's own response counters by status code (frontend repo,
    # njs/metrics.js), which the error ratio reads: stub_status counts
    # requests without their status.
    - port: responses
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_service_name]
          regex: .+-canary
        - action: replace
          targetLabel: revision
          replacement: canary
