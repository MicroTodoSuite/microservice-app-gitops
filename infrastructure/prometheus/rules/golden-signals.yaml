apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: business-workload-golden-signals
  labels:
    app.kubernetes.io/part-of: microtodosuite
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  groups:
    - name: microtodosuite.golden-signals.traffic-and-errors
      rules:
        # Traffic: real Counters that already exist in each service today.
        # Grouped by namespace and by revision ("stable" or "canary", set by
        # the ServiceMonitors in servicemonitors/), so the canary gate reads the
        # canary revision's own signal and each environment's stable traffic
        # stays apart. `and on (job, instance) up == 1` keeps only the targets
        # Prometheus scrapes now: rate() still reads a vanished target's
        # samples for the whole window, which would blend the pods that just
        # left a -canary Service into the canary's figures. users-api's canary
        # scrape job is users-api-canary. frontend's requests are nginx's own
        # response counters (frontend repo, njs/metrics.js).
        - record: workload:http_requests:rate5m
          expr: |
            sum by (namespace, workload, revision) (
              (
                label_replace(rate(auth_api_requests_total[5m]), "workload", "auth-api", "", "")
                or label_replace(rate(todo_api_requests_total[5m]), "workload", "todos-api", "", "")
                or label_replace(rate(http_server_requests_seconds_count{job=~"users-api(-canary)?"}[5m]), "workload", "users-api", "", "")
                or label_replace(rate(log_messages_processed_total[5m]) + rate(log_messages_failed_total[5m]), "workload", "log-message-processor", "", "")
                or label_replace(rate(frontend_http_responses_total[5m]), "workload", "frontend", "", "")
              )
              and on (job, instance) up == 1
            )
        # Errors: ratio of failed to total, per workload. auth-api/todos-api
        # label status on their Counter; users-api's status comes from
        # Micrometer's default tag; log-message-processor separates processed
        # vs failed Counters; frontend counts nginx's responses by status code.
        # A workload that served requests without a 5xx has no numerator
        # series, so the numerator defaults to zero there instead of leaving
        # the ratio without a value. A workload that served no request at all
        # still yields 0/0, NaN, which the canary gate passes explicitly.
        - record: workload:http_errors:ratio5m
          expr: |
            (
              sum by (namespace, workload, revision) (
                (
                  label_replace(rate(auth_api_requests_total{status=~"5.."}[5m]), "workload", "auth-api", "", "")
                  or label_replace(rate(todo_api_requests_total{status=~"5.."}[5m]), "workload", "todos-api", "", "")
                  or label_replace(rate(http_server_requests_seconds_count{job=~"users-api(-canary)?",status=~"5.."}[5m]), "workload", "users-api", "", "")
                  or label_replace(rate(log_messages_failed_total[5m]), "workload", "log-message-processor", "", "")
                  or label_replace(rate(frontend_http_responses_total{status=~"5.."}[5m]), "workload", "frontend", "", "")
                )
                and on (job, instance) up == 1
              )
              or workload:http_requests:rate5m * 0
            )
            /
            workload:http_requests:rate5m
    - name: microtodosuite.golden-signals.latency
      rules:
        # Latency: average request duration. users-api (Micrometer Summary)
        # and log-message-processor (Histogram) already provide this. auth-api
        # and todos-api need the Histogram added by this feature's Story 1
        # tasks (T016/T017) before this series has data for them; until then
        # this recording rule correctly returns no data for those two,
        # rather than a fabricated value.
        - record: workload:http_request_duration_seconds:avg5m
          expr: |
            sum by (workload) (
              label_replace(rate(auth_api_request_duration_seconds_sum[5m]), "workload", "auth-api", "", "")
              or label_replace(rate(todo_api_request_duration_seconds_sum[5m]), "workload", "todos-api", "", "")
              or label_replace(rate(http_server_requests_seconds_sum{job="users-api"}[5m]), "workload", "users-api", "", "")
              or label_replace(rate(log_message_processing_duration_seconds_sum[5m]), "workload", "log-message-processor", "", "")
            )
            /
            sum by (workload) (
              label_replace(rate(auth_api_request_duration_seconds_count[5m]), "workload", "auth-api", "", "")
              or label_replace(rate(todo_api_request_duration_seconds_count[5m]), "workload", "todos-api", "", "")
              or label_replace(rate(http_server_requests_seconds_count{job="users-api"}[5m]), "workload", "users-api", "", "")
              or label_replace(rate(log_message_processing_duration_seconds_count[5m]), "workload", "log-message-processor", "", "")
            )
        # p99 latency for the full-profile canary gate (spec 009, T110). Needs
        # real histogram buckets, not just _sum/_count: users-api already
        # exposes them (management.metrics.distribution.percentiles-histogram
        # enabled in application.properties), log-message-processor's
        # Histogram always has, and auth-api/todos-api now do too (spec 011
        # OpenTelemetry instrumentation, verified in each service's
        # metrics.go/metrics.js: an explicit-bucket Histogram on the exact
        # auth_api_request_duration_seconds/todo_api_request_duration_seconds
        # series this file's avg5m expression already reads) — all four
        # resolve today. frontend is deliberately excluded, not just missing
        # data: its only latency-adjacent metric is the
        # nginx-prometheus-exporter's request Counter (no duration histogram
        # is scraped until T018 adds one), so there is no metric family to
        # reference at all.
        - record: workload:http_request_duration_seconds:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le, namespace, workload, revision) (
                (
                  label_replace(rate(auth_api_request_duration_seconds_bucket[5m]), "workload", "auth-api", "", "")
                  or label_replace(rate(todo_api_request_duration_seconds_bucket[5m]), "workload", "todos-api", "", "")
                  or label_replace(rate(http_server_requests_seconds_bucket{job=~"users-api(-canary)?"}[5m]), "workload", "users-api", "", "")
                  or label_replace(rate(log_message_processing_duration_seconds_bucket[5m]), "workload", "log-message-processor", "", "")
                )
                and on (job, instance) up == 1
              )
            )
    - name: microtodosuite.golden-signals.alerts
      rules:
        # Decided in the Clarifications session: 5xx ratio above 5% sustained
        # for 5 minutes, scoped to stable production traffic (not the
        # transient canary window, which Argo Rollouts' own analysis run
        # already gates separately).
        - alert: WorkloadHighErrorRate
          expr: workload:http_errors:ratio5m{revision="stable"} > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.workload }} error rate above 5%"
            description: "{{ $labels.workload }} has a 5xx ratio of {{ $value | humanizePercentage }} over the last 5 minutes."
        # Latency threshold is a starting default, not a measured baseline
        # (this environment has no live traffic to derive one from); tune it
        # once real eks-dev traffic data exists.
        - alert: WorkloadHighLatency
          expr: workload:http_request_duration_seconds:avg5m{revision="stable"} > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.workload }} average latency above 1s"
            description: "{{ $labels.workload }} average request duration is {{ $value | humanizeDuration }} over the last 5 minutes."
    # Saturation is intentionally NOT defined here yet. Computing it needs
    # either kube-state-metrics (container resource requests/limits as a
    # series) or a kubelet-cAdvisor ServiceMonitor (raw usage) - both were
    # scoped out of the vendored kube-prometheus subset (vendor/v0.18.0/
    # README.md) because this feature's environment has no live eks-dev
    # access to verify a kubelet scrape actually succeeds there (EKS does
    # not expose a pre-created `kubelet` Service the way kubeadm clusters
    # do). Disclosed gap, not a silent omission: see
    # specs/006-observability-platform-foundation/tasks.md follow-up note.
    # Re-add this group only after live-verifying the scrape target on
    # eks-dev.
