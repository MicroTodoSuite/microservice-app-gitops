apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Complete cert-manager release bundle plus an issued-certificate capability
# check. Issuer policy for real environments remains registration-owned.
resources:
  - vendor/v1.21.0/install.yaml
  - capability-check.yaml

images:
  - name: quay.io/jetstack/cert-manager-controller
    digest: sha256:e370f7800a53078e9d74324287a7d52b553864e55f5b4e521f911c3f6c7da203
  - name: quay.io/jetstack/cert-manager-cainjector
    digest: sha256:ad1dcc5b2fccc420f9b3fbee7ce8a869450c540fd4f2f41de2d95b1ca0c4d701
  - name: quay.io/jetstack/cert-manager-webhook
    digest: sha256:c33cca307541e2d58861a55b1af5f390b7e19c8741e48b433693b73a7cce88b3

# The on-demand ACME solver reference is an argument, not a pod image field, so
# Kustomize's image transformer cannot rewrite it.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cert-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver@sha256:33ebbc2688578e37bd48dcc5b6b1f1362c919dff44fe5e5f602532a2d37d514f
