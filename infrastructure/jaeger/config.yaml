# Trimmed copy of Jaeger 2.20.0's real all-in-one config
# (https://raw.githubusercontent.com/jaegertracing/jaeger/v2.20.0/cmd/jaeger/config-badger.yaml),
# with a single Badger store (no archive store, out of scope here), 3-day
# retention per the Clarifications session, and storage moved onto the PVC
# mount path this Deployment declares.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info

    extensions:
      healthcheckv2:
        use_v2: true
        http:

      jaeger_query:
        storage:
          traces: badger_store

      jaeger_storage:
        backends:
          badger_store:
            badger:
              directories:
                keys: /badger/data/keys
                values: /badger/data/values
              ephemeral: false
              ttl:
                spans: 72h

    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:

    exporters:
      jaeger_storage_exporter:
        trace_storage: badger_store
