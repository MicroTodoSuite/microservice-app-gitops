# Adapted from Loki 3.7.6's real single-binary reference config
# (https://raw.githubusercontent.com/grafana/loki/v3.7.6/cmd/loki/loki-local-config.yaml):
# storage moved from /tmp onto the PVC this StatefulSet mounts, retention
# enabled at 3 days per the Clarifications session, and anonymous usage
# reporting to Grafana Labs disabled. delete_request_store is mandatory once
# retention_enabled is true (Loki's own compactor.Validate() rejects an empty
# value); "filesystem" matches schema_config's object_store below - there is
# no separate store to name here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki/data
      storage:
        filesystem:
          chunks_directory: /loki/data/chunks
          rules_directory: /loki/data/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      retention_period: 72h

    compactor:
      working_directory: /loki/data/compactor
      retention_enabled: true
      delete_request_store: filesystem

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    frontend:
      encoding: protobuf

    analytics:
      reporting_enabled: false
