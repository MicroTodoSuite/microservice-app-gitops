apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On-demand kube-hunter evidence run (spec 009 T088, research.md Decision 22,
# Decision 17). Disabled by default: infrastructure/kube-hunter/kustomization.yaml
# does not include this directory. To collect evidence, add "- triggers" to its
# resources in a reviewed pull request, let ArgoCD sync, read the report with
# scripts/managed/verify-security.sh, then revert that commit. The parent root's
# NetworkPolicies select the same app.kubernetes.io/name label, so they also
# govern this Job once it is activated.
resources:
  - job.yaml

namespace: security
