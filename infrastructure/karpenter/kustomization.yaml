apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Karpenter, deployed by ArgoCD from a rendered, pinned Helm template
# (spec 009, T086). Full-profile-only, like infrastructure/istio/.
#
# Not activated: settings.clusterName is a deliberate CHANGEME placeholder
# (the chart requires SOME value to render at all — see
