# ARN, and node-provisioning/ (EC2NodeClass + NodePool) is excluded here on
# purpose — see node-provisioning/kustomization.yaml.
#
# Ownership note: per constitution principle 11, ArgoCD owns this add-on.
resources:
  - vendor/v1.14.1/crds.yaml
  - vendor/v1.14.1/install.yaml
