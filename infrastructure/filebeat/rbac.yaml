# ECK does not create Filebeat's Kubernetes-autodiscover RBAC automatically;
# these are the standard upstream Filebeat permissions (read-only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-filebeat
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-filebeat
subjects:
  - kind: ServiceAccount
    name: platform-filebeat
    namespace: filebeat
