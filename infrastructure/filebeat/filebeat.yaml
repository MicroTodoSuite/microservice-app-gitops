# Resource-bounded (T084). Ships directly to Elasticsearch rather than
# through infrastructure/logstash/ — the simpler, ECK-documented path,
# chosen to avoid guessing Logstash's generated Beats Service DNS name
# without a live cluster to confirm it against. Routing through Logstash
# for enrichment is a follow-up refinement, not a defect: both satisfy
# "Filebeat as collector" (plan-reconciliation.md §10), the full-profile
# substitute for the economical profile's Grafana Alloy.
#
# `${NODE_NAME}` below is only resolved because the container spec injects it
# via fieldRef (spec.nodeName) — that env var does not exist by default;
# without it the pod crashed on startup ("missing field accessing
# 'filebeat.autodiscover.providers.0.node'"), caught live, not by rendering.
# Confirmed live end-to-end after the fix: 6441+ events acked by
# Elasticsearch. A transient 401 for the first ~30s after the Beat starts
# (the ECK-managed Elasticsearch user/role takes a moment to propagate) and
# scattered "Error decoding JSON" on a few non-JSON lines inside otherwise
# JSON container logs are both expected noise, not defects — the pipeline
# keeps shipping through both.
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: platform
spec:
  type: filebeat
  version: 9.4.4
  image: docker.elastic.co/beats/filebeat@sha256:fa4330da529e88e51241c5a3091ff6484f0ea74a79e516c78524bc7ac0faae79
  elasticsearchRef:
    name: platform
    namespace: elasticsearch
  config:
    filebeat.autodiscover.providers:
      - type: kubernetes
        node: ${NODE_NAME}
        hints.enabled: true
        hints.default_config.type: container
        hints.default_config.paths:
          - /var/log/containers/*${data.kubernetes.container.id}.log
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: platform-filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                cpu: 200m
                memory: 200Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
