apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  selector: {}
  template:
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: frontend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: frontend-config}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
