apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    app.kubernetes.io/component: business-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    app.kubernetes.io/component: business-service
  ports:
    - {name: http, port: 8080, targetPort: http}
    # The canary ServiceMonitors scrape these through this Service alone, the
    # one Argo Rollouts points at the canary ReplicaSet.
    - {name: metrics, port: 9113, targetPort: metrics}
    - {name: responses, port: 9114, targetPort: 9114}
