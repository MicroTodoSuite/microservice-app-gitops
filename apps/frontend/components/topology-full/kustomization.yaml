apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - includeSelectors: false
    pairs: {microtodosuite.io/topology: full}
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: frontend}
      spec:
        template:
          metadata:
            annotations: {sidecar.istio.io/inject: "true"}
  # Soft spread across nodes and zones (spec 009 T090, research.md Decision 23):
  # ScheduleAnyway keeps pods schedulable while a cluster runs one stable node.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: frontend
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: frontend

# Full-profile traffic policy (spec 009, T083). Components support resources;
# these render into every full overlay that includes this component.
resources:
  - pod-disruption-budget.yaml
  - destination-rule.yaml
  - virtual-service.yaml
