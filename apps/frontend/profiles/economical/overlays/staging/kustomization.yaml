apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-staging
resources: [../../topology]
replicas: [{name: frontend, count: 2}]
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: frontend}
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 128Mi}
images:
  - name: frontend
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-frontend
    digest: sha256:952ef1211a8800511e17195f4d0c59eafc54e71761456292af0b3dee6b7ab33b
