apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-staging
resources: [../../topology]
replicas: [{name: frontend, count: 2}]
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: frontend}
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 128Mi}
images:
  - name: frontend
    newName: 376784708420.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-frontend
    digest: sha256:b9b8d3d92d4474b60d730fba7a0872fc5d4e5546d9f4472fea773075f9693471
