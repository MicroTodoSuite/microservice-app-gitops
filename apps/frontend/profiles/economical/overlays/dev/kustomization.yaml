apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-dev
resources: [../../topology]
replicas: [{name: frontend, count: 1}]
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: frontend}
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 128Mi}
images:
  - name: frontend
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/frontend
    digest: sha256:ebb0184f1d35d278d92488212358597bf3eb9cbd611d36311ccf91b073cb8e86
