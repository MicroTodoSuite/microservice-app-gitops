apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-staging
resources: [../../topology]
replicas: [{name: frontend, count: 2}]
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: frontend}
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 128Mi}
images:
  - name: frontend
    newName: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/frontend
    digest: sha256:e9dcd7750bdbbd6cf4817dde5c1c50e825dd9febd1d4d11bf518d52bad94df6f
