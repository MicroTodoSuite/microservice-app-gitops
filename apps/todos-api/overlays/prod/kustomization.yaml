apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-prod
resources: [../../topology]
components: [../../components/strategy-canary]
patches:
  - target: {kind: ConfigMap, name: todos-api-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: todos-api-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: todos-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: todos-api}
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: todos-api
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: todos-api
    newName: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/todos-api
    digest: sha256:3eaec4619be2c08201a25bc21569e5b00e97e7e00d35270d907b46aa7128c948
