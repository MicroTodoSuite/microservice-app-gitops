apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-prod
resources:
- ../../topology
components:
- ../../components/strategy-canary
patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: todos-api-config}
    data:
      REDIS_HOST: redis
  target:
    kind: ConfigMap
    name: todos-api-config
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: todos-api}
    spec:
      replicas: 0
      template:
        metadata:
          annotations:
            release-evidence.microtodosuite.io/exercise: canary-health-gate-v2
            runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
        spec:
          containers:
            - name: todos-api
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 256Mi}
  target:
    kind: Deployment
    name: todos-api
images:
- digest: sha256:5c57160d3e627aa3818cc893b76264d84838a2911f2c7f92945e0e7fcd446262
  name: todos-api
  newName: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/todos-api
