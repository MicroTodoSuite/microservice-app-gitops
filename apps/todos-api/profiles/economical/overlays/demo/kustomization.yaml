apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-demo
resources: [../../topology]
replicas: [{name: todos-api, count: 1}]
patches:
  - target: {kind: ConfigMap, name: todos-api-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: todos-api-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: todos-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: todos-api}
      spec:
        template:
          metadata:
            annotations:
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: todos-api
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: todos-api
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/todos-api
    digest: sha256:d87af1c7b126522453a10a7474f164d9de450c3bcd0d8e928dc3748baa9cf191
