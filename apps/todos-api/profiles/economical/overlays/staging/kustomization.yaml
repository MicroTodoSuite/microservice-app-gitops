apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-staging
resources: [../../topology]
replicas: [{name: todos-api, count: 1}]
patches:
  - target: {kind: ConfigMap, name: todos-api-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: todos-api-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: todos-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: todos-api}
      spec:
        template:
          metadata:
            annotations:
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: todos-api
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: todos-api
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-todosapi
    digest: sha256:711f8954b9203468a07404816fa6dd90d9b4725c693e5caf8bafb98e81fe189e
