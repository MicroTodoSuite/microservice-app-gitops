apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - includeSelectors: false
    pairs: {microtodosuite.io/topology: full}
patches:
  - target: {kind: Deployment, name: todos-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: todos-api}
      spec:
        template:
          metadata:
            annotations: {sidecar.istio.io/inject: "true"}
  # Soft spread across nodes and zones (spec 009 T090, research.md Decision 23):
  # ScheduleAnyway keeps pods schedulable while a cluster runs one stable node.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: todos-api
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: todos-api
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: todos-api
  # The service container reads its feature toggles beside its controlled
  # settings (spec 009 T090, research.md Decision 23).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: todos-api
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: todos-api
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: todos-api-feature-toggles

# Full-profile traffic policy (spec 009, T083). Components support resources;
# these render into every full overlay that includes this component.
resources:
  - pod-disruption-budget.yaml
  - destination-rule.yaml
  - virtual-service.yaml

# Default-off feature toggles (spec 009 T090, research.md Decision 23). The
# generated name carries a content hash, so a reviewed change rolls the pods.
# Every key follows docs/feature-toggles.md.
configMapGenerator:
  - name: todos-api-feature-toggles
    options:
      annotations:
        microtodosuite.io/feature-toggle-contract: docs/feature-toggles.md
