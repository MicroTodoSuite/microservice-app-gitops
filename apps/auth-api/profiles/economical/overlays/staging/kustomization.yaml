apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Active managed staging overlay. Staging receives the digest already verified
# in dev, promoted by copying the digest — never a rebuilt artifact.
namespace: microtodo-staging

resources:
- ../../topology

replicas:
- count: 2
  name: auth-api

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-api
    spec:
      template:
        spec:
          containers:
            - name: auth-api
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
  target:
    kind: Deployment
    name: auth-api

images:
- digest: sha256:9161a9d737eaee4af013fac39c598583c5ea71786643e2c4658c6281db74425d
  name: auth-api
  newName: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
