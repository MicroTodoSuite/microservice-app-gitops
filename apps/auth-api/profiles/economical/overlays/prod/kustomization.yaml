apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Active managed production overlay. Namespace policy (ResourceQuota,
# LimitRange, NetworkPolicies, RBAC) is environment-owned and lives under
# environments/, while this overlay selects the immutable promoted artifact and
# the Argo Rollouts canary strategy.
namespace: microtodo-prod

resources:
  - ../../topology

components:
  - ../../../../components/strategy-canary

patches:
  - target:
      kind: Deployment
      name: auth-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-api
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
          spec:
            containers:
              - name: auth-api
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

images:
  - name: auth-api
    newName: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
    digest: sha256:04af9a416d532184bfd98bc73c77f936138f861572eec0fdbf5ecb6aae76189d
