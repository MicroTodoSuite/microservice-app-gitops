apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Active managed dev overlay for the shared EKS registration. Values below are
# environment-owned; CI publishes one immutable image and GitOps promotes its
# digest unchanged through every managed environment.
namespace: microtodo-dev

resources:
- ../../topology

replicas:
- count: 1
  name: auth-api

                  # Only the on/off switch and target for tracing (otel.go
                  # in the auth-api repo); the OpenTelemetry SDK reads this
                  # standard env var itself, no code-level endpoint literal.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-api
    spec:
      template:
        spec:
          containers:
            - name: auth-api
              env:
                # Only the on/off switch and target for tracing (otel.go
                # in the auth-api repo); the OpenTelemetry SDK reads this
                # standard env var itself, no code-level endpoint literal.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://jaeger-collector.observability.svc:4317
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
  target:
    kind: Deployment
    name: auth-api

# The neutral ECR repository is shared across managed environments.
images:
- digest: sha256:7946d32f94101781683974ca34687ed4f7931b3813345f2b371e2fb39abb3cf2
  name: auth-api
  newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
