apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Active managed dev overlay for the shared EKS registration. Values below are
# environment-owned; CI publishes one immutable image and GitOps promotes its
# digest unchanged through every managed environment.
namespace: microtodo-dev

resources:
- ../../topology

replicas:
- count: 1
  name: auth-api

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-api
    spec:
      template:
        spec:
          containers:
            - name: auth-api
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
  target:
    kind: Deployment
    name: auth-api

# The neutral ECR repository is shared across managed environments.
images:
- digest: sha256:b8aba84e88ec6593cd99631977664ed5ec1900fe80e0b98aa02404ff680abf8b
  name: auth-api
  newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-authapi
