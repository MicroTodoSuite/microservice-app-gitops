apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SINGLE SWITCH between the economical and full versions for this service.
# All three environment overlays build from here, so flipping the component
# below changes every environment at once — no per-overlay edits.
#
# Economical (active):  ../components/topology-economical
# Full:                 ../components/topology-full   <-- change this one line
resources:
  - ../base

components:
  - ../components/topology-economical
