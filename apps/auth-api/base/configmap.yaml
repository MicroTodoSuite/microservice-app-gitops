apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-api-config
data:
  # The binary has no default port: AUTH_API_PORT is mandatory (main.go:46).
  AUTH_API_PORT: "8000"
  # Placeholder until users-api is migrated. The pod starts and serves /version
  # and /metrics; /login stays degraded until users-api exists. Environment
  # overlays may patch this value.
  USERS_API_ADDRESS: "http://users-api:8083"
  # ZIPKIN_URL is intentionally omitted: when empty, tracing is disabled
  # (main.go:93).
  # Tracing destination and reported name for every environment (spec 010).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability.svc:4317"
  OTEL_SERVICE_NAME: "auth-api"
