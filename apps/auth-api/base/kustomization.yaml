apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# auth-api reusable base: environment-neutral manifests shared by every
# environment. Overlays own namespace, replicas, capacity, registry, and the
# immutable image digest. Version (economical/full) differences are Components
# selected through ../topology.
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - serviceaccount.yaml

# The Secret `auth-api-secrets` (key JWT_SECRET) is provided per-environment by
# External Secrets Operator, never committed. The local overlay uses an ESO
# Password generator; managed environments use an AWS Secrets Manager store.
# The base only declares that the workload consumes that Secret (see
# deployment.yaml); it never carries the value.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
  # Business-service is part of the pilot's established selector contract. Keep
  # it stable: Deployment selectors are immutable once the workload exists.
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: business-service
