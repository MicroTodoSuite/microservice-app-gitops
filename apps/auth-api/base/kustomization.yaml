apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base de auth-api: manifiestos comunes a todos los ambientes.
# Los overlays (dev/staging/prod) fijan namespace, réplicas y tag de imagen.
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

# Local bootstrap bridge only. This ignored file must contain a newly rotated
# value generated outside Git. Managed environments will replace this generator
# with an External Secrets Operator resource using the same Secret contract.
secretGenerator:
  - name: auth-api-secrets
    envs:
      - secret-values.local.env

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
