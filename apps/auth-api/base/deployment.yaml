apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
spec:
  # replicas: owned by each environment overlay
  selector: {}
  template:
    spec:
      serviceAccountName: auth-api
      containers:
        - name: auth-api
          # Neutral image key. Each environment overlay sets newName (registry)
          # and an immutable digest via the Kustomize images transformer.
          # Capacity (resources) and pull behavior are environment-owned and
          # therefore live in overlays, never here.
          image: auth-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: auth-api-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-api-secrets
                  key: JWT_SECRET
          # /version is the lightest service-owned route and does not depend on
          # users-api, so health never requires a second business service.
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /version
              port: http
            failureThreshold: 12
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            # TODO: runAsNonRoot once the auth-api Dockerfile stops running as
            # root (tracked outside this repository).
