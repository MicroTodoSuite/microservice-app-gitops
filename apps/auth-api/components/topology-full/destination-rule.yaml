# Full-topology traffic policy for auth-api (spec 009, T083): mesh mTLS to this
# host plus the connection-pool and outlier-detection half of "retries/
# timeouts/connection pools/outlier detection". Host is namespace-relative so
# this component stays environment-neutral (each full env namespace holds the
# service). Lives in components/topology-full/ so it applies only in the full
# profile — the economical profile has no mesh (constitution principle 9).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: auth-api
spec:
  host: auth-api
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 64
      http:
        http1MaxPendingRequests: 32
        http2MaxRequests: 64
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
