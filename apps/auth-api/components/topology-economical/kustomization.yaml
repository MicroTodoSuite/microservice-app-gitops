apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Economical topology: single cluster, environments as namespaces, NO service mesh.
# Tags the workload and explicitly opts out of Istio sidecar injection so the pod
# never gets a mesh proxy in a cluster that has no mesh.
labels:
  - includeSelectors: false
    pairs:
      microtodosuite.io/topology: economical

patches:
  - target:
      kind: Deployment
      name: auth-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-api
      spec:
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
