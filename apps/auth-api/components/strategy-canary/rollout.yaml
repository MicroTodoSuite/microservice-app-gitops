apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-api
spec:
  replicas: 3
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-api
    scaleDown: onsuccess
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
      app.kubernetes.io/component: business-service
  strategy:
    canary:
      canaryService: auth-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause: {duration: 15s}
        - analysis:
            templates:
              - templateName: microtodosuite-canary-health
                clusterScope: true
            args:
              - name: workload
                value: auth-api
        - setWeight: 100
