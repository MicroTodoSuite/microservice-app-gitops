# Aislamiento de la versión económica: cuota por namespace para que prod
# no pueda ser ahogado por vecinos ruidosos de otros ambientes.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: microtodo-prod-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
