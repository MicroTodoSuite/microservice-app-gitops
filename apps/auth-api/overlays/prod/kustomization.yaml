apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INACTIVE managed-environment scaffold. Production stays structurally disabled
# until its blocking prerequisites exist (namespace controls, immutable
# promotion, Argo Rollouts canary, policy gates — see docs/production-readiness
# concerns in specs/001-local-gitops-pilot). Namespace policy (ResourceQuota,
# LimitRange, NetworkPolicies, RBAC) is environment-owned and lives under
# environments/, not in a service overlay.
namespace: microtodo-prod

resources:
  - ../../topology

components:
  - ../../components/strategy-canary

patches:
  - target:
      kind: Deployment
      name: auth-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-api
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
          spec:
            containers:
              - name: auth-api
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

images:
  - name: auth-api
    newName: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
    digest: sha256:c4514e18b83b7265b90a8f7e62cbf31868fbe539d3e6c65356d9a0f4e8356fdc
