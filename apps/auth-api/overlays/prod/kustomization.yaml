apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente prod — versión económica: ambiente = namespace.
# El aislamiento se refuerza con ResourceQuota (y a futuro NetworkPolicies/RBAC).
namespace: microtodo-prod

resources:
  - ../../base
  - resourcequota.yaml

replicas:
  - name: auth-api
    count: 3

# Prod recibe el tag ya validado en staging (PR con aprobación manual)
images:
  - name: auth-api
    newTag: 0.1.0-local
