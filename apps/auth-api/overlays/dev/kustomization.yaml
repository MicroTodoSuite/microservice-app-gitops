apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente dev — versión económica: ambiente = namespace.
# En la versión completa este overlay apuntará al clúster eks-dev.
namespace: microtodo-dev

resources:
- ../../base

replicas:
- count: 1
  name: auth-api

# Este tag es lo que actualiza scripts/bump-image.sh (y en el punto 4, el PR automático de CI)
images:
- name: auth-api
  newName: auth-api
  newTag: 0.1.1-local
