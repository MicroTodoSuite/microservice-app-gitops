apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev environment — economical version: environment = namespace.
# In the full version this overlay maps to the eks-dev cluster (data-only change).
namespace: microtodo-dev

# Builds from topology/ (base + selected version component), not base directly.
resources:
  - ../../topology

replicas:
  - name: auth-api
    count: 1

# This tag is what scripts/bump-image.sh updates (and the CI PR in roadmap #4).
images:
  - name: auth-api
    newTag: 0.1.0-local
