# Local secret provisioning WITHOUT committing any secret value.
# ESO's Password generator creates a random JWT secret inside the cluster; the
# ExternalSecret writes it into the Secret contract the Deployment already reads
# (name: auth-api-secrets, key: JWT_SECRET). No secret material exists in Git.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: auth-api-jwt
spec:
  length: 40
  digits: 8
  symbols: 0
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-api-secrets
spec:
  # Generate once; a JWT signing secret should be stable, not rotated on a timer.
  refreshInterval: "0"
  target:
    name: auth-api-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: auth-api-jwt
