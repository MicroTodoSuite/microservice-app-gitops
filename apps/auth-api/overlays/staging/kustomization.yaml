apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INACTIVE managed-environment scaffold (see dev/kustomization.yaml for the
# activation contract). Staging receives the digest already verified in dev,
# promoted by copying the digest — never a rebuilt artifact.
namespace: microtodo-staging

resources:
  - ../../topology

replicas:
  - name: auth-api
    count: 2

patches:
  - target:
      kind: Deployment
      name: auth-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-api
      spec:
        template:
          spec:
            containers:
              - name: auth-api
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

images:
  - name: auth-api
    newName: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
    digest: sha256:9c298bf1390c2b40469238e32a5b1e370b1174860f4d9366c66d38e81406ba2f
