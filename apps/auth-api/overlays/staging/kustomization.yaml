apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente staging — versión económica: ambiente = namespace.
namespace: microtodo-staging

resources:
  - ../../base

replicas:
  - name: auth-api
    count: 2

# Staging recibe el tag ya probado en dev (promoción por PR que copia el tag)
images:
  - name: auth-api
    newTag: 0.1.0-local
