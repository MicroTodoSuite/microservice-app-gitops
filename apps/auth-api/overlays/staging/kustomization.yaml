apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging environment — economical version: environment = namespace.
namespace: microtodo-staging

# Builds from topology/ (base + selected version component), not base directly.
resources:
  - ../../topology

replicas:
  - name: auth-api
    count: 2

# Staging receives the tag already verified in dev (promotion via tag-copy PR).
images:
  - name: auth-api
    newTag: 0.1.0-local
