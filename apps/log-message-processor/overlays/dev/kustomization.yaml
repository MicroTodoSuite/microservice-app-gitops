apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-dev
resources:
- ../../topology
replicas:
- count: 1
  name: log-message-processor
patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: log-message-processor-config}
    data:
      REDIS_HOST: redis
  target:
    kind: ConfigMap
    name: log-message-processor-config
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: log-message-processor}
    spec:
      template:
        metadata:
          annotations:
            runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
        spec:
          containers:
            - name: log-message-processor
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 256Mi}
  target:
    kind: Deployment
    name: log-message-processor
images:
- digest: sha256:17c5848722fe9bc5a7daf618418008e39ea8077a75dca0ed1c7e5a755bcdfc51
  name: log-message-processor
  newName: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/log-message-processor
