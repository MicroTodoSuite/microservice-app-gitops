apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Deliberately no DestinationRule/VirtualService (spec 009, T083), unlike the
# four HTTP services. log-message-processor is a Redis Pub/Sub subscriber with
# no HTTP Service (its base Service exposes only a metrics port) — nothing
# routes mesh HTTP traffic to it, so there is no host to apply retries,
# timeouts, connection pools, or outlier detection to. It is still a full mesh
# member: the sidecar is injected below and mesh-wide STRICT mTLS
# (infrastructure/istio/peer-authentication.yaml) covers its Redis egress.
labels:
  - includeSelectors: false
    pairs: {microtodosuite.io/topology: full}
patches:
  - target: {kind: Deployment, name: log-message-processor}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: log-message-processor}
      spec:
        template:
          metadata:
            annotations: {sidecar.istio.io/inject: "true"}
  # Soft spread across nodes and zones (spec 009 T090, research.md Decision 23):
  # ScheduleAnyway keeps pods schedulable while a cluster runs one stable node.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: log-message-processor
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: log-message-processor
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: log-message-processor
  # Cost allocation (spec 009 T144, research.md Decision 24): the pods carry the
  # profile whose cost the dashboard reports, beside the app.kubernetes.io/name
  # they already carry. kube-state-metrics turns both into kube_pod_labels
  # columns. The label goes on the pod template only; the selector is immutable
  # once the Deployment exists, and the economical overlays never carry it.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: log-message-processor
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/microtodosuite.io~1profile
        value: full
  # The service container reads its feature toggles beside its controlled
  # settings (spec 009 T090, research.md Decision 23).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: log-message-processor
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: log-message-processor
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: log-message-processor-feature-toggles

# Full-profile disruption budget (spec 009 T090, research.md Decision 23).
resources:
  - pod-disruption-budget.yaml

# Default-off feature toggles (spec 009 T090, research.md Decision 23). The
# generated name carries a content hash, so a reviewed change rolls the pods.
# Every key follows docs/feature-toggles.md.
configMapGenerator:
  - name: log-message-processor-feature-toggles
    options:
      annotations:
        microtodosuite.io/feature-toggle-contract: docs/feature-toggles.md
