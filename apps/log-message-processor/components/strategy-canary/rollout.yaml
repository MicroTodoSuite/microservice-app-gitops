apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: log-message-processor}
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  workloadRef: {apiVersion: apps/v1, kind: Deployment, name: log-message-processor, scaleDown: onsuccess}
  selector:
    matchLabels:
      app.kubernetes.io/name: log-message-processor
      app.kubernetes.io/part-of: microtodosuite
      app.kubernetes.io/component: business-service
  strategy:
    canary:
      canaryService: log-message-processor-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause: {duration: 15s}
        - analysis:
            templates:
              - {templateName: microtodosuite-canary-health, clusterScope: true}
            args:
              - {name: target-url, value: "http://log-message-processor-canary:9090/metrics"}
        - setWeight: 100
