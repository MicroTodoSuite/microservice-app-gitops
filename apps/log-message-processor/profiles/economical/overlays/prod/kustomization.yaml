apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-prod
resources: [../../topology]
components: [../../../../components/strategy-canary]
patches:
  - target: {kind: ConfigMap, name: log-message-processor-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: log-message-processor-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: log-message-processor}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: log-message-processor}
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: log-message-processor
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: log-message-processor
    newName: 376784708420.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-logmsgproc
    digest: sha256:591c852b0a85f61b216dd500cd3d2c3096b1194374ff15c5a7ef88ccd2f7c8f4
