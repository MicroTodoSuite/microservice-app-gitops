apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-prod
resources: [../../topology]
components: [../../../../components/strategy-canary]
patches:
  - target: {kind: ConfigMap, name: log-message-processor-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: log-message-processor-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: log-message-processor}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: log-message-processor}
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: log-message-processor
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: log-message-processor
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/log-message-processor
    digest: sha256:6a28da9a405a0c29b743626c073f45908940e772ea6b59a89eea317327622445
