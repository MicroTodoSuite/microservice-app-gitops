apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microtodo-prod
resources: [../../topology]
# Deliberately stays on the native replica-weighted strategy-canary, not
# strategy-canary-full (spec 009, T110), for the same reason topology-full
# gives it no DestinationRule/VirtualService: it is a Redis Pub/Sub consumer
# with no HTTP Service to route Istio traffic to.
components: [../../../../components/strategy-canary]
patches:
  - target: {kind: ConfigMap, name: log-message-processor-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: log-message-processor-config}
      data:
        REDIS_HOST: redis
  - target: {kind: Deployment, name: log-message-processor}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: log-message-processor}
      spec:
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
              runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
          spec:
            containers:
              - name: log-message-processor
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 250m, memory: 256Mi}
images:
  - name: log-message-processor
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-logmsgproc
    digest: sha256:17c5848722fe9bc5a7daf618418008e39ea8077a75dca0ed1c7e5a755bcdfc51
