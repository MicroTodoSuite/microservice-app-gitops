apiVersion: v1
kind: ConfigMap
metadata: {name: log-message-processor-config}
data:
  PORT: "9090"
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CHANNEL: "log_channel"
  # Tracing destination and reported name for every environment (spec 010).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability.svc:4317"
  OTEL_SERVICE_NAME: "log-message-processor"
