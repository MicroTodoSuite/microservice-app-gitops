apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microtodo-staging
resources: [../../topology]
replicas:
  - name: users-api
    count: 1
patches:
  - target: {kind: Deployment, name: users-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: users-api}
      spec:
        template:
          spec:
            containers:
              - name: users-api
                resources:
                  requests: {cpu: 150m, memory: 256Mi}
                  limits: {cpu: 500m, memory: 512Mi}
images:
  - name: users-api
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/users-api
    digest: sha256:aff885d11f9e6fcc78c1bd21fcc302f2a0073459f5c784b067f289cf72e786af
