apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microtodo-prod
resources: [../../topology]
components: [../../../../components/strategy-canary]
patches:
  - target: {kind: Deployment, name: users-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: users-api}
      spec:
        # workloadRef owns one production replica. The source Deployment remains
        # at zero so migration does not duplicate the pod-local H2 workload.
        replicas: 0
        template:
          metadata:
            annotations:
              release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
          spec:
            containers:
              - name: users-api
                resources:
                  requests: {cpu: 150m, memory: 256Mi}
                  limits: {cpu: 500m, memory: 512Mi}
images:
  - name: users-api
    newName: 575172595729.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/users-api
    digest: sha256:82c4ea7911297129da943a5b7f8ae95e42cc40bb7689e856cb5f067faef67aa1
