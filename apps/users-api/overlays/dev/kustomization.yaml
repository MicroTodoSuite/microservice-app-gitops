apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microtodo-dev
resources:
- ../../topology
replicas:
- count: 1
  name: users-api
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: users-api}
    spec:
      template:
        spec:
          containers:
            - name: users-api
              resources:
                requests: {cpu: 150m, memory: 256Mi}
                limits: {cpu: 500m, memory: 512Mi}
  target:
    kind: Deployment
    name: users-api
