apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: users-api}
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  workloadRef: {apiVersion: apps/v1, kind: Deployment, name: users-api, scaleDown: onsuccess}
  selector:
    matchLabels:
      app.kubernetes.io/name: users-api
      app.kubernetes.io/part-of: microtodosuite
      app.kubernetes.io/component: business-service
  strategy:
    canary:
      canaryService: users-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause: {duration: 15s}
        - analysis:
            templates:
              - {templateName: microtodosuite-canary-health, clusterScope: true}
            args:
              - {name: target-url, value: "http://users-api-canary:8083/prometheus"}
        - setWeight: 100
