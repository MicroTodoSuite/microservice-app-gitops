name: validate-gitops

# Renders and schema-validates every environment, and enforces the GitOps
# hygiene rules, WITHOUT any cluster credentials or deployment. Closes the
# task-3 validation gap and guards service onboarding (spec 003, research D15).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install checksum-locked kustomize and kubeconform
        run: |
          set -euo pipefail
          install_locked_tool() {
            local name="$1" url checksum archive extract_dir
            url="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .source' scripts/managed/full-profile-toolchain.lock)"
            checksum="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .sha256' scripts/managed/full-profile-toolchain.lock)"
            archive="$(mktemp)"
            extract_dir="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
            tar -xzf "$archive" -C "$extract_dir" "$name"
            sudo install -m 0755 "$extract_dir/$name" "/usr/local/bin/$name"
          }
          install_locked_tool kustomize
          install_locked_tool kubeconform
          kustomize version
          kubeconform -v

      - name: Render + schema-validate every kustomization
        run: |
          set -euo pipefail
          # Every directory that has a kustomization.yaml is a render target.
          fail=0
          while IFS= read -r kdir; do
            echo "::group::render $kdir"
            if kustomize build "$kdir" \
                | kubeconform -strict -ignore-missing-schemas -summary; then
              echo "OK: $kdir"
            else
              echo "::error::render/validate failed for $kdir"; fail=1
            fi
            echo "::endgroup::"
          done < <(find apps clusters environments bootstrap infrastructure \
                     -name kustomization.yaml -not -path '*/components/*' -printf '%h\n' \
                   | sort -u)
          # components/ are Kustomize Components (not standalone-buildable) and
          # are exercised through the overlays/topology that include them.
          exit $fail

  profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install checksum-locked kustomize
        run: |
          set -euo pipefail
          url="$(jq -er '.tools[] | select(.name == "kustomize") | .source' scripts/managed/full-profile-toolchain.lock)"
          checksum="$(jq -er '.tools[] | select(.name == "kustomize") | .sha256' scripts/managed/full-profile-toolchain.lock)"
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$extract_dir" kustomize
          sudo install -m 0755 "$extract_dir/kustomize" /usr/local/bin/kustomize
          kustomize version

      - name: Preserve economical renders and validate profile routing
        run: tests/profiles/validate-profile-routing.bats

      - name: Validate destination-scoped image promotion
        run: tests/promotion/bump-image.bats

      - name: Reject mutable deployable application images
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r overlay; do
            while IFS= read -r image; do
              if [[ ! "$image" =~ @sha256:[a-f0-9]{64}$ ]]; then
                echo "::error file=$overlay::mutable rendered image: $image"
                fail=1
              fi
            done < <(kustomize build "$overlay" | awk '$1 == "image:" {gsub(/"/, "", $2); print $2}')
          done < <(find apps -type f -name kustomization.yaml \
            \( -path '*/profiles/*/overlays/*/kustomization.yaml' -o -path '*/overlays/local/kustomization.yaml' \) \
            -printf '%h\n' | sort -u)
          exit "$fail"

  policy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned JSON Schema runtime
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'jsonschema==4.25.1'

      - name: Validate single-owner infrastructure inventory
        run: tests/evidence/validate-ownership.bats

      - name: Reject committed secret material
        run: |
          set -euo pipefail
          # No secret VALUE may be committed. ESO references (name/key only) and
          # go-template placeholders are allowed; a literal assignment is not.
          if grep -rniE \
               'JWT_SECRET:[[:space:]]*["'\'']?[A-Za-z0-9]{6,}' \
               apps environments clusters \
             | grep -viE '\{\{|secretKeyRef|key:|name:'; then
            echo "::error::a committed secret value was found"; exit 1
          fi
          if grep -rniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' apps environments clusters; then
            echo "::error::a committed private key was found"; exit 1
          fi
          echo "OK: no committed secret material"

      - name: Reject post-bootstrap imperative managed mutations
        run: tests/policy/no-imperative-managed-mutations.bats

      # The bootstrap helper's whole value is in what it refuses, and a refusal
      # that stops working is silent: the bootstrap still succeeds, just against
      # the wrong cluster or an unreviewed revision.
      - name: Verify the managed cluster bootstrap boundary
        run: tests/bootstrap/managed-cluster-bootstrap.bats
