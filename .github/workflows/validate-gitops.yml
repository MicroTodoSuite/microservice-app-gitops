name: validate-gitops

# Renders and schema-validates every environment, and enforces the GitOps
# hygiene rules, WITHOUT any cluster credentials or deployment. Closes the
# task-3 validation gap and guards service onboarding (spec 003, research D15).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install checksum-locked kustomize and kubeconform
        run: |
          set -euo pipefail
          install_locked_tool() {
            local name="$1" url checksum archive extract_dir
            url="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .source' scripts/managed/full-profile-toolchain.lock)"
            checksum="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .sha256' scripts/managed/full-profile-toolchain.lock)"
            archive="$(mktemp)"
            extract_dir="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
            tar -xzf "$archive" -C "$extract_dir" "$name"
            sudo install -m 0755 "$extract_dir/$name" "/usr/local/bin/$name"
          }
          install_locked_tool kustomize
          install_locked_tool kubeconform
          kustomize version
          kubeconform -v

      - name: Render + schema-validate every kustomization
        run: |
          set -euo pipefail
          # Every directory that has a kustomization.yaml is a render target.
          fail=0
          while IFS= read -r kdir; do
            echo "::group::render $kdir"
            if kustomize build "$kdir" \
                | kubeconform -strict -ignore-missing-schemas -summary; then
              echo "OK: $kdir"
            else
              echo "::error::render/validate failed for $kdir"; fail=1
            fi
            echo "::endgroup::"
          done < <(find apps clusters environments bootstrap infrastructure \
                     -name kustomization.yaml -not -path '*/components/*' -printf '%h\n' \
                   | sort -u)
          # components/ are Kustomize Components (not standalone-buildable) and
          # are exercised through the overlays/topology that include them.
          exit $fail

  profile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install checksum-locked kustomize
        run: |
          set -euo pipefail
          url="$(jq -er '.tools[] | select(.name == "kustomize") | .source' scripts/managed/full-profile-toolchain.lock)"
          checksum="$(jq -er '.tools[] | select(.name == "kustomize") | .sha256' scripts/managed/full-profile-toolchain.lock)"
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$extract_dir" kustomize
          sudo install -m 0755 "$extract_dir/kustomize" /usr/local/bin/kustomize
          kustomize version

      - name: Preserve economical renders and validate profile routing
        run: tests/profiles/validate-profile-routing.bats

      - name: Validate economical runtime dependency cleanup
        run: tests/contract/economical-runtime-quiescence.sh

      - name: Validate the economical public entry point
        run: tests/contract/economical-public-entry.sh

      - name: Validate destination-scoped image promotion
        run: tests/promotion/bump-image.bats

      - name: Reject mutable deployable application images
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r overlay; do
            while IFS= read -r image; do
              if [[ ! "$image" =~ @sha256:[a-f0-9]{64}$ ]]; then
                echo "::error file=$overlay::mutable rendered image: $image"
                fail=1
              fi
            done < <(kustomize build "$overlay" | awk '$1 == "image:" {gsub(/"/, "", $2); print $2}')
          done < <(find apps -type f -name kustomization.yaml \
            \( -path '*/profiles/*/overlays/*/kustomization.yaml' -o -path '*/overlays/local/kustomization.yaml' \) \
            -printf '%h\n' | sort -u)
          exit "$fail"

  policy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate GitHub Actions runtime pins
        run: tests/contract/github-actions-runtime.sh

      - name: Install pinned JSON Schema runtime
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'jsonschema==4.25.1'

      - name: Install checksum-locked kustomize and kubeconform
        run: |
          set -euo pipefail
          install_locked_tool() {
            local name="$1" url checksum archive extract_dir
            url="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .source' scripts/managed/full-profile-toolchain.lock)"
            checksum="$(jq -er --arg name "$name" '.tools[] | select(.name == $name) | .sha256' scripts/managed/full-profile-toolchain.lock)"
            archive="$(mktemp)"
            extract_dir="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
            tar -xzf "$archive" -C "$extract_dir" "$name"
            sudo install -m 0755 "$extract_dir/$name" "/usr/local/bin/$name"
          }
          install_locked_tool kustomize
          install_locked_tool kubeconform
          kustomize version
          kubeconform -v

      - name: Validate the full-topology mesh policy render (spec 009 T069)
        run: tests/platform/mesh-policy.bats

      - name: Validate the per-service mesh traffic policy render (spec 009 T083)
        run: tests/platform/mesh-traffic-policy.bats

      - name: Validate single-owner infrastructure inventory
        run: tests/evidence/validate-ownership.bats

      - name: Validate full-profile evidence integrity (spec 009 T142/T145)
        env:
          EVIDENCE_MAX_AGE_DAYS: "30"
        run: tests/evidence/validate-evidence.bats

      - name: Validate the active economical AWS account
        run: tests/contract/economical-account-recovery.sh

      - name: Validate rebuilt resource names (ops spec 004 T016)
        run: tests/contract/rebuilt-resource-names.sh

      - name: Validate full-cluster identities and settings (spec 009 T083/T086)
        run: tests/platform/full-cluster-identities.bats

      - name: Validate the single declared AWS account
        run: tests/contract/aws-account-parameter.sh

      - name: Validate the one-command account change
        run: tests/contract/set-aws-account.sh

      - name: Validate the observability platform static contract (spec 006)
        run: tests/contract/observability.sh

      - name: Validate the runtime security static contract (spec 008)
        run: tests/contract/security.sh

      - name: Validate the service tracing configuration (spec 010)
        run: tests/contract/service-tracing.sh

      - name: Validate a designated codeowner for prod overlay changes (spec 003 T020)
        run: tests/contract/prod-overlay-approval.sh

      - name: Validate the shared local JWT source (spec 003 T029)
        run: tests/contract/shared-jwt-local.sh

      - name: Reject committed secret material
        run: |
          set -euo pipefail
          # No secret VALUE may be committed. ESO references (name/key only) and
          # go-template placeholders are allowed; a literal assignment is not.
          if grep -rniE \
               'JWT_SECRET:[[:space:]]*["'\'']?[A-Za-z0-9]{6,}' \
               apps environments clusters \
             | grep -viE '\{\{|secretKeyRef|key:|name:'; then
            echo "::error::a committed secret value was found"; exit 1
          fi
          if grep -rniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' apps environments clusters; then
            echo "::error::a committed private key was found"; exit 1
          fi
          echo "OK: no committed secret material"

      - name: Validate the chaos-mesh and opencost render (spec 009 T087)
        run: tests/platform/chaos-mesh-opencost.bats

      - name: Validate the DR game-day scenarios (spec 009 T123)
        run: tests/chaos/dr-game-day.bats

      - name: Validate the AKS disaster-recovery root (spec 009 T120)
        run: tests/profiles/aks-dr.bats

      - name: Validate the eck stack render (spec 009 T084)
        run: tests/platform/eck.bats

      - name: Validate the aws-load-balancer-controller render (spec 009 T083)
        run: tests/platform/aws-load-balancer-controller.bats

      - name: Validate the karpenter render (spec 009 T086)
        run: tests/platform/karpenter.bats

      - name: Validate rebuilt full-cluster roots (spec 009 T050/T063/T065)
        run: tests/platform/full-cluster-roots-rebuilt.bats

      - name: Validate the sonarqube hardening render (spec 009 T084)
        run: tests/platform/sonarqube.bats

      - name: Validate the full-profile observability roots (spec 009 T085)
        run: tests/platform/observability-full.bats

      - name: Validate the admission and runtime security hardening (spec 009 T088)
        run: tests/platform/security-hardening.bats

      - name: Validate the full-profile service runtime (spec 009 T090)
        run: tests/platform/service-runtime-full.bats

      - name: Validate full-profile cost allocation (spec 009 T144)
        run: tests/platform/opencost-allocation.bats

      - name: Validate the full-profile cost evidence collector (spec 009 T147)
        run: tests/platform/verify-full-profile-cost.bats

      - name: Reject post-bootstrap imperative managed mutations
        run: tests/policy/no-imperative-managed-mutations.bats

      # The bootstrap helper's whole value is in what it refuses, and a refusal
      # that stops working is silent: the bootstrap still succeeds, just against
      # the wrong cluster or an unreviewed revision.
      - name: Verify the managed cluster bootstrap boundary
        run: tests/bootstrap/managed-cluster-bootstrap.bats
