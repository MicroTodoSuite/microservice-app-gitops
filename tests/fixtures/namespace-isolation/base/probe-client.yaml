apiVersion: apps/v1
kind: Deployment
metadata:
  name: namespace-isolation-probe-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: namespace-isolation-probe-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: namespace-isolation-probe-client
    spec:
      serviceAccountName: namespace-isolation-probe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe-client
          image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          command: [/bin/sh, -ec]
          args:
            - |
              while true; do
                timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=dns result=ALLOWED"
                else
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=dns result=FAILED"
                fi
                if redis-cli -h redis -p 6379 ping | grep -qx PONG; then
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=redis-local result=ALLOWED"
                else
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=redis-local result=FAILED"
                fi
                if redis-cli -h namespace-isolation-probe-server -p 6380 ping | grep -qx PONG; then
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=tcp-local result=ALLOWED"
                else
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=tcp-local result=FAILED"
                fi
                for endpoint in "$FOREIGN_PROBE_A" "$FOREIGN_PROBE_B"; do
                  if timeout 3 redis-cli -h "$endpoint" -p 6380 ping >/dev/null 2>&1; then
                    result=UNEXPECTED_ALLOWED
                  else
                    result=DENIED
                  fi
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV target=$endpoint kind=tcp-cross result=$result"
                done
                for endpoint in "$FOREIGN_REDIS_A" "$FOREIGN_REDIS_B"; do
                  if timeout 3 redis-cli -h "$endpoint" -p 6379 ping >/dev/null 2>&1; then
                    result=UNEXPECTED_ALLOWED
                  else
                    result=DENIED
                  fi
                  echo "probe timestamp=$timestamp source=$SOURCE_ENV target=$endpoint kind=redis-cross result=$result"
                done
                event="$SOURCE_ENV:$timestamp"
                redis-cli -h redis -p 6379 PUBLISH isolation-events "$event" >/dev/null
                echo "probe timestamp=$timestamp source=$SOURCE_ENV kind=redis-publish event=$event result=PUBLISHED"
                sleep 30
              done
          env:
            - name: SOURCE_ENV
              value: unset
            - name: FOREIGN_PROBE_A
              value: unset
            - name: FOREIGN_PROBE_B
              value: unset
            - name: FOREIGN_REDIS_A
              value: unset
            - name: FOREIGN_REDIS_B
              value: unset
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, "test -r /proc/1/status"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, "test -r /proc/1/status"]
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
