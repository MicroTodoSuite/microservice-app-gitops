apiVersion: apps/v1
kind: Deployment
metadata:
  name: namespace-isolation-probe-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: namespace-isolation-probe-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: namespace-isolation-probe-server
    spec:
      serviceAccountName: namespace-isolation-probe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe-server
          image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          args:
            - redis-server
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "no"
            - --port
            - "6380"
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: probe
              containerPort: 6380
          readinessProbe:
            exec:
              command: [redis-cli, -h, 127.0.0.1, -p, "6380", ping]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: [redis-cli, -h, 127.0.0.1, -p, "6380", ping]
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
