apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-prod
---
apiVersion: v1
data:
  AUTH_API_PORT: "8000"
  USERS_API_ADDRESS: http://users-api:8083
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api-config
  namespace: microtodo-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
  name: auth-api-canary
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-prod
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
  template:
    metadata:
      annotations:
        release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/component: business-service
        app.kubernetes.io/name: auth-api
        app.kubernetes.io/part-of: microtodosuite
    spec:
      containers:
      - env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: auth-api-secrets
        envFrom:
        - configMapRef:
            name: auth-api-config
        image: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api@sha256:04af9a416d532184bfd98bc73c77f936138f861572eec0fdbf5ecb6aae76189d
        livenessProbe:
          httpGet:
            path: /version
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: auth-api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /version
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /version
            port: http
          periodSeconds: 5
      serviceAccountName: auth-api
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-api
  namespace: microtodo-prod
spec:
  progressDeadlineSeconds: 300
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
  strategy:
    canary:
      canaryService: auth-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 50
      - pause:
          duration: 15s
      - analysis:
          args:
          - name: workload
            value: auth-api
          templates:
          - clusterScope: true
            templateName: microtodosuite-canary-health
      - setWeight: 100
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-api
    scaleDown: onsuccess
