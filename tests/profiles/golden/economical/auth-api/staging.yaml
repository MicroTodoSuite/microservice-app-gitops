apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-staging
---
apiVersion: v1
data:
  AUTH_API_PORT: "8000"
  USERS_API_ADDRESS: http://users-api:8083
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api-config
  namespace: microtodo-staging
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-staging
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: auth-api
  namespace: microtodo-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: auth-api
      app.kubernetes.io/part-of: microtodosuite
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/component: business-service
        app.kubernetes.io/name: auth-api
        app.kubernetes.io/part-of: microtodosuite
    spec:
      containers:
      - env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: auth-api-secrets
        envFrom:
        - configMapRef:
            name: auth-api-config
        image: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api@sha256:04af9a416d532184bfd98bc73c77f936138f861572eec0fdbf5ecb6aae76189d
        livenessProbe:
          httpGet:
            path: /version
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: auth-api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /version
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /version
            port: http
          periodSeconds: 5
      serviceAccountName: auth-api
