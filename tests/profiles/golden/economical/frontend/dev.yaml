apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-dev
---
apiVersion: v1
data:
  AUTH_API_ADDRESS: http://auth-api:8000
  TODOS_API_ADDRESS: http://todos-api:8082
  ZIPKIN_URL: http://127.0.0.1:9411/api/v2/spans
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend-config
  namespace: microtodo-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-dev
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9113
    targetPort: metrics
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: microtodosuite
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/component: business-service
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: microtodosuite
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: frontend-config
        image: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/frontend@sha256:5fe218db17bb8d71d00458c44d8a88e9d7c9875f7e5a4cfee980eef45de0e728
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /
            port: http
          periodSeconds: 3
      - args:
        - --nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
        image: nginx/nginx-prometheus-exporter@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 15
        name: nginx-metrics
        ports:
        - containerPort: 9113
          name: metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: frontend
