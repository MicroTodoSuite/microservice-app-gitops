apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-prod
---
apiVersion: v1
data:
  AUTH_API_ADDRESS: http://auth-api:8000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector.observability.svc:4317
  OTEL_SERVICE_NAME: frontend
  TODOS_API_ADDRESS: http://todos-api:8082
  ZIPKIN_URL: http://127.0.0.1:9411/api/v2/spans
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend-config
  namespace: microtodo-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9113
    targetPort: metrics
  - name: responses
    port: 9114
    targetPort: 9114
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
  name: frontend-canary
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9113
    targetPort: metrics
  - name: responses
    port: 9114
    targetPort: 9114
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: frontend
  namespace: microtodo-prod
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: microtodosuite
  template:
    metadata:
      annotations:
        release-evidence.microtodosuite.io/exercise: canary-health-gate-v1
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/component: business-service
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: microtodosuite
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AUTH_API_ADDRESS
          value: http://auth-api.$(POD_NAMESPACE).svc.cluster.local:8000
        - name: TODOS_API_ADDRESS
          value: http://todos-api.$(POD_NAMESPACE).svc.cluster.local:8082
        envFrom:
        - configMapRef:
            name: frontend-config
        image: 575172595729.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-frontend@sha256:ff9f348fe90afc3438c77b29aa6a61595dd6733b4c9975a4e4e3f2656e814b85
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /
            port: http
          periodSeconds: 3
      - args:
        - --nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
        image: nginx/nginx-prometheus-exporter@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 15
        name: nginx-metrics
        ports:
        - containerPort: 9113
          name: metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: frontend
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: microtodo-prod
spec:
  progressDeadlineSeconds: 300
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: microtodosuite
  strategy:
    canary:
      canaryService: frontend-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 50
      - pause:
          duration: 15s
      - analysis:
          args:
          - name: workload
            value: frontend
          templates:
          - clusterScope: true
            templateName: microtodosuite-canary-health
      - setWeight: 100
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
    scaleDown: onsuccess
