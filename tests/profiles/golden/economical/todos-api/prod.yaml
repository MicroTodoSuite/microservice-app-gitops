apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: todos-api
  namespace: microtodo-prod
---
apiVersion: v1
data:
  REDIS_CHANNEL: log_channel
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  TODO_API_PORT: "8082"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: todos-api-config
  namespace: microtodo-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: todos-api
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8082
    targetPort: http
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
  name: todos-api-canary
  namespace: microtodo-prod
spec:
  ports:
  - name: http
    port: 8082
    targetPort: http
  selector:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: business-service
    app.kubernetes.io/name: todos-api
    app.kubernetes.io/part-of: microtodosuite
    microtodosuite.io/topology: economical
  name: todos-api
  namespace: microtodo-prod
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: todos-api
      app.kubernetes.io/part-of: microtodosuite
  template:
    metadata:
      annotations:
        data-continuity.microtodosuite.io/risk: process-local-todos
        release-evidence.microtodosuite.io/exercise: canary-health-gate-v2
        runtime-config.microtodosuite.io/revision: namespace-local-redis-v1
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/component: business-service
        app.kubernetes.io/name: todos-api
        app.kubernetes.io/part-of: microtodosuite
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: auth-api-secrets
        envFrom:
        - configMapRef:
            name: todos-api-config
        image: 916491575487.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/todos-api@sha256:3ff827efe849fe812151c221c3d4c418d7490384e2bcb5c1bb9975fd3f2a4185
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: todos-api
        ports:
        - containerPort: 8082
          name: http
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 3
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: todos-api
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: todos-api
  namespace: microtodo-prod
spec:
  progressDeadlineSeconds: 300
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: business-service
      app.kubernetes.io/name: todos-api
      app.kubernetes.io/part-of: microtodosuite
  strategy:
    canary:
      canaryService: todos-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 50
      - pause:
          duration: 15s
      - analysis:
          args:
          - name: workload
            value: todos-api
          templates:
          - clusterScope: true
            templateName: microtodosuite-canary-health
      - setWeight: 100
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todos-api
    scaleDown: onsuccess
