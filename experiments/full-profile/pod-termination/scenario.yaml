apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-termination
  namespace: microtodo-prod
  labels:
    microtodosuite.io/experiment: pod-termination
    microtodosuite.io/target-cluster: eks-full-prod
spec:
  action: pod-kill
  mode: one
  duration: 5m
  selector:
    namespaces: [microtodo-prod]
    labelSelectors:
      app.kubernetes.io/name: auth-api
