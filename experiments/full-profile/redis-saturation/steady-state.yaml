apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-saturation-steady-state
  namespace: microtodo-prod
data:
  targetCluster: eks-full-prod
  maxDuration: 5m
  abortProcedure: git-revert
  steadyState: Production Redis and dependent services are healthy before and after bounded CPU pressure.
  abortConditions: |
    - economical-regression
    - selector-expansion
    - both-destinations-unhealthy
    - duration-exceeded
    - release-digest-divergence
    - telemetry-unavailable
    - operator-abort
