apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD bootstrap. Uses the VENDORED, checksum-pinned manifest so the running
# pilot never fetches ArgoCD from a hosted URL (spec 001, FR-017). Applied once
# by scripts/pilot/bootstrap.sh inside the audited bootstrap boundary; after
# that, clusters/base/argocd.yaml makes ArgoCD self-manage from this same path.
namespace: argocd

resources:
  - namespace.yaml
  - vendor/v3.5.0/install.yaml
