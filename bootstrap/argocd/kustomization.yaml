apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD bootstrap. Uses the VENDORED, checksum-pinned manifest so the running
# pilot never fetches ArgoCD from a hosted URL (spec 001, FR-017). Applied once
# by scripts/pilot/bootstrap.sh inside the audited bootstrap boundary; after
# that, clusters/base/argocd.yaml makes ArgoCD self-manage from this same path.
namespace: argocd

resources:
  - namespace.yaml
  - vendor/v3.5.0/install.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        applicationsetcontroller.enable.progressive.syncs: "true"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          metadata:
            annotations:
              microtodosuite.io/progressive-syncs-revision: "v1"
