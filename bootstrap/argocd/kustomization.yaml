apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bootstrap de ArgoCD. Se aplica UNA sola vez a mano en local
# (`kustomize build bootstrap/argocd | kubectl apply -f -`); después,
# la Application `argocd` de clusters/ hace que ArgoCD se gestione a sí mismo.
# En AWS, este apply inicial lo dispara Terraform (tarea 1).
namespace: argocd

resources:
  - namespace.yaml
  # Manifiesto oficial de instalación, versión PINNEADA (no usar stable/HEAD)
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/install.yaml
