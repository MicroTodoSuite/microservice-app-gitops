# Git-reviewed registration values for the full-profile staging cluster.
#
# Created by aws/environments/fstg/workload in the rebuilt domain layout.
# Full staging is fstg; the legacy demo-full foundation is not this rollout
# path and is never adopted by this registration.
#
# The EKS endpoint, certificate authority data, and OIDC provider ARN stay
# Terraform-owned bootstrap inputs and are deliberately not duplicated here:
# a value that lives in two places drifts, and the copy nobody applies is the
# one people read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-registration
  namespace: argocd
data:
  repoURL: https://github.com/MicroTodoSuite/microservice-app-gitops.git
  revision: main
  physicalCluster: lex-mts-fstg-eks-main
