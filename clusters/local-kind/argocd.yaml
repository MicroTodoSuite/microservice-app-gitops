# ArgoCD auto-gestionado: ArgoCD sincroniza su propia instalación desde Git.
# Actualizar ArgoCD = cambiar el tag pinneado en bootstrap/argocd/kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: microtodosuite
  source:
    repoURL: https://github.com/MicroTodoSuite/microservice-app-gitops.git
    targetRevision: main
    path: bootstrap/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # nunca auto-borrar componentes de ArgoCD
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # los CRDs de ArgoCD superan el límite de client-side apply
