# Microservice ApplicationSet.
#
# Generates one ArgoCD Application per {service × environment} from a matrix of:
#   - a git generator that discovers services  (apps/*)
#   - a list generator that declares environments and, crucially, WHERE each one
#     is deployed (server + namespace).
#
# THE DUAL-TOPOLOGY SEAM (spec 001, US1): the destination is data, not template
# logic. Today every environment points at the local cluster
# (https://kubernetes.default.svc) in its own namespace = economical version.
# To move to the full version, change the `server` of each environment entry to a
# registered remote cluster URL — no edits to any service base/overlays.
# See clusters/README.md for the full-version layout.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1) Discover services: apps/auth-api, apps/todos-api, ...
          - git:
              repoURL: https://github.com/MicroTodoSuite/microservice-app-gitops.git
              revision: main
              directories:
                - path: apps/*
          # 2) Declare environments and their physical destination.
          - list:
              elements:
                - env: dev
                  server: https://kubernetes.default.svc
                  namespace: microtodo-dev
                - env: staging
                  server: https://kubernetes.default.svc
                  namespace: microtodo-staging
                - env: prod
                  server: https://kubernetes.default.svc
                  namespace: microtodo-prod
  template:
    metadata:
      # apps/auth-api + env dev -> auth-api-dev
      name: "{{.path.basename}}-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1" # after platform add-ons
    spec:
      project: microtodosuite
      source:
        repoURL: https://github.com/MicroTodoSuite/microservice-app-gitops.git
        targetRevision: main
        path: "{{.path.path}}/overlays/{{.env}}"
      destination:
        server: "{{.server}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
