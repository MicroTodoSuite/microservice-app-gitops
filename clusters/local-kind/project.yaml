# AppProject del proyecto: agrupa todas las Applications de MicroTodoSuite
# y define qué repos y destinos tienen permitidos.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microtodosuite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # antes que las Applications que lo referencian
spec:
  description: MicroTodoSuite - microservicios y add-ons de plataforma
  sourceRepos:
    - https://github.com/MicroTodoSuite/microservice-app-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*" # los add-ons instalan CRDs y ClusterRoles; se restringe más adelante
