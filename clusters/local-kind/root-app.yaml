# App-of-Apps raíz del clúster local-kind.
# ÚNICO manifiesto que se aplica a mano tras el bootstrap de ArgoCD:
#   kubectl apply -f clusters/local-kind/root-app.yaml
# Todo lo demás (project, self-manage, infra, apps) lo despliega ArgoCD desde Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # el root vive en default; crea el project microtodosuite para el resto
  source:
    repoURL: https://github.com/MicroTodoSuite/microservice-app-gitops.git
    targetRevision: main
    path: clusters/local-kind
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
