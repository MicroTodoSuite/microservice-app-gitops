# App-of-Apps root for the local pilot cluster. This file is applied ONCE by
# scripts/pilot/bootstrap.sh inside the audited bootstrap boundary (see
# docs/bootstrap-boundary.md); everything else is reconciled by ArgoCD from the
# machine-local Git source. It is intentionally NOT referenced by the
# kustomization so a cluster sync never re-applies it as a child of itself
# through a different path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # root creates the microtodosuite project for everything else
  source:
    repoURL: http://host.docker.internal:8081/microservice-app-gitops.git
    targetRevision: main
    path: clusters/local-kind
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
