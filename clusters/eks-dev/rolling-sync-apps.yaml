# Industry-standard delivery for the shared cluster: keep the base template's
# automated + selfHeal sync policy (continuous reconciliation, no silent drift)
# and orchestrate it with RollingSync so environments converge in order
# dev -> staging -> prod, one at a time, never advancing until the previous
# environment is Healthy. Human control lives in Git (promotion PRs, the prod
# approval gate, branch protection on overlays/prod) and progressive delivery is
# handled by the Argo Rollouts canary in the prod overlay -- not by withholding
# sync. Ordered waves require the ApplicationSet progressive-syncs feature to be
# enabled on this cluster (applicationsetcontroller.enable.progressive.syncs).
- op: add
  path: /spec/strategy
  value:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: microtodosuite.io/environment
              operator: In
              values: ["dev"]
          maxUpdate: 1
        - matchExpressions:
            - key: microtodosuite.io/environment
              operator: In
              values: ["staging"]
          maxUpdate: 1
        - matchExpressions:
            - key: microtodosuite.io/environment
              operator: In
              values: ["prod"]
          maxUpdate: 1
