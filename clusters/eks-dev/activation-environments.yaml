# Shared-cluster foundation: activate the environment-policy Applications of
# the four managed environments (T173).
- op: replace
  path: /spec/generators/0/list/elements
  value:
    - env: dev
      server: https://kubernetes.default.svc
    - env: staging
      server: https://kubernetes.default.svc
    - env: prod
      server: https://kubernetes.default.svc
    - env: demo
      server: https://kubernetes.default.svc
