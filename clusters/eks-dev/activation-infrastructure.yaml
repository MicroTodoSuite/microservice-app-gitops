# Shared-cluster platform: the thirteen controllers the cluster ran before the
# 2026-09-11 quiescence, plus trivy-operator, which the security contract
# requires of an active registration (T173), and the AWS Load Balancer Controller
# that publishes the economical environments (T174).
- op: replace
  path: /spec/generators/0/list/elements
  value:
    - name: keda
      path: infrastructure/keda
      namespace: keda
    - name: cert-manager
      path: infrastructure/cert-manager
      namespace: cert-manager
    - name: external-secrets
      path: infrastructure/external-secrets
      namespace: external-secrets
    - name: kyverno
      path: infrastructure/kyverno
      namespace: kyverno
    - name: argo-rollouts
      path: infrastructure/argo-rollouts
      namespace: argo-rollouts
    - name: ebs-csi-driver
      path: infrastructure/ebs-csi-driver
      namespace: kube-system
    - name: prometheus
      path: infrastructure/prometheus
      namespace: observability
    - name: grafana
      path: infrastructure/grafana
      namespace: observability
    - name: jaeger
      path: infrastructure/jaeger
      namespace: observability
    - name: loki
      path: infrastructure/loki
      namespace: observability
    - name: falco
      path: infrastructure/falco
      namespace: security
    - name: kube-bench
      path: infrastructure/kube-bench
      namespace: security
    - name: kube-hunter
      path: infrastructure/kube-hunter
      namespace: security
    - name: trivy-operator
      path: infrastructure/trivy-operator
      namespace: security
    - name: aws-load-balancer-controller
      path: infrastructure/profiles/economical/aws-load-balancer-controller/destinations/eks-dev
      namespace: kube-system
