apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Value-only registration of the AWS EKS dev cluster. The patch and replacement
# wiring intentionally matches clusters/local-kind: this sibling consumes the
# shared mechanism (../base) and contributes only repository, revision, and
# activation values. Both activation lists remain empty for registration only.
resources:
  - ../base
  - registration.yaml

patches:
  - path: activation-apps.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: apps
  - path: activation-environments.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: environments

replacements:
  - source:
      kind: ConfigMap
      name: cluster-registration
      fieldPath: data.repoURL
    targets:
      - select:
          kind: AppProject
          name: microtodosuite
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: default
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: Application
          name: argocd
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: infrastructure
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: environments
        fieldPaths:
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: apps
        fieldPaths:
          - spec.generators.0.matrix.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
  - source:
      kind: ConfigMap
      name: cluster-registration
      fieldPath: data.revision
    targets:
      - select:
          kind: Application
          name: argocd
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: infrastructure
        fieldPaths:
          - spec.generators.0.git.revision
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: environments
        fieldPaths:
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: apps
        fieldPaths:
          - spec.generators.0.matrix.generators.0.git.revision
          - spec.template.spec.source.targetRevision
