# Coordinated shared-cluster release: activate every managed environment in
# one reviewed revision so RollingSync controls dev -> staging -> prod.
- op: replace
  path: /spec/generators/0/matrix/generators/1/list/elements
  value:
    - env: dev
      profile: economical
      destination: eks-dev
      server: https://kubernetes.default.svc
    - env: staging
      profile: economical
      destination: eks-dev
      server: https://kubernetes.default.svc
    - env: prod
      profile: economical
      destination: eks-dev
      server: https://kubernetes.default.svc
    - env: demo
      server: https://kubernetes.default.svc
