# Trust boundary for every MicroTodoSuite Application on this cluster.
# No */* wildcards: cluster-scoped kinds are limited to what the pinned ArgoCD
# render and namespace management actually require.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microtodosuite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: MicroTodoSuite - platform and application delivery
  sourceRepos:
    - https://registration.invalid/microservice-app-gitops.git # value injected by the cluster registration
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: "microtodo-*"
    # Platform add-on namespaces (content owned by roadmap task 2).
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceBlacklist: []
