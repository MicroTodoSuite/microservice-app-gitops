# Permanent, least-privilege project for the bootstrap root Application. ArgoCD
# creates `default` during bootstrap; keeping it in root desired state prevents
# the root from pruning the project it needs in order to reconcile everything
# else.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: MicroTodoSuite bootstrap root only
  sourceRepos:
    - https://registration.invalid/microservice-app-gitops.git # value injected by the cluster registration
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
  namespaceResourceBlacklist: []
---
# Trust boundary for every non-root MicroTodoSuite Application on this cluster.
# No */* wildcards: cluster-scoped kinds are limited to what the pinned add-on
# and namespace-management renders actually require.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microtodosuite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: MicroTodoSuite - platform and application delivery
  sourceRepos:
    - https://registration.invalid/microservice-app-gitops.git # value injected by the cluster registration
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: "microtodo-*"
    # Platform add-on namespaces (content owned by roadmap task 2).
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: redis
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: observability
    # Full upstream KEDA and cert-manager renders include narrowly named
    # authentication-reader and leader-election RBAC objects here.
    - server: https://kubernetes.default.svc
      namespace: kube-system
  # Cluster-scoped kinds the platform add-ons actually install (derived from the
  # pinned renders): namespaces, CRDs, cluster RBAC, and admission webhooks.
  # No "*/*" wildcard.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: kyverno.io
      kind: ClusterPolicy
    - group: argoproj.io
      kind: ClusterAnalysisTemplate
  # Prometheus Operator's CRDs (Prometheus, Alertmanager, ServiceMonitor,
  # PrometheusRule, AlertmanagerConfig, etc.) are all Namespaced-scope (see
  # infrastructure/prometheus/vendor/v0.18.0/setup/*.yaml), so they need no
  # clusterResourceWhitelist entry - they are already covered by the generic
  # CustomResourceDefinition entry above plus the `observability` destination
  # namespace and the empty namespaceResourceBlacklist below.
  namespaceResourceBlacklist: []
